
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas Circuit — PIXEL</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #f4f7ff;
    background:
        radial-gradient(circle at top, #173c42, transparent 55%),
        linear-gradient(135deg, #07151c, #101c2c 60%, #07151c);
}

header {
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid #ffffff18;
}

header h1 {
    margin: 0;
    color: #65f5c0;
    letter-spacing: 3px;
}

header p {
    color: #9eafbd;
    margin-bottom: 0;
}

.container {
    width: min(1050px, 94%);
    margin: 25px auto;
}

.panel {
    background: #101f2de8;
    border: 1px solid #ffffff18;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 15px 50px #0005;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 18px;
}

.stat {
    background: #172d3b;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
}

.stat span {
    display: block;
    color: #8ca4b5;
    font-size: 12px;
    margin-bottom: 7px;
}

.stat strong {
    font-size: 22px;
    color: #65f5c0;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
}

button, select {
    border: 1px solid #ffffff20;
    border-radius: 10px;
    padding: 11px 15px;
    color: white;
    background: #203b4c;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #2b5965;
}

button.primary {
    background: #087f69;
    border-color: #20d9a9;
}

button.primary:hover {
    background: #0a9b7c;
}

#board {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    padding: 20px 5px;
    overflow-x: auto;
}

.tile-row {
    display: flex;
    justify-content: center;
    gap: 7px;
}

.tile {
    width: clamp(34px, 7vw, 62px);
    height: clamp(34px, 7vw, 62px);
    background: #173b42;
    border: 2px solid #28635c;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background .2s, border-color .2s;
    flex-shrink: 0;
}

.tile:hover {
    background: #24534f;
    border-color: #65f5c0;
}

.tile.powered {
    background: #164e42;
    border-color: #65f5c0;
    box-shadow: 0 0 13px #38e6a455;
}

.tile.source {
    border-color: #ffd166;
    background: #594b23;
}

.wire-rotator {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .28s ease;
}

.wire {
    position: relative;
    width: 100%;
    height: 100%;
}

.wire::before {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    background: #91a9a8;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

.wire .line {
    position: absolute;
    background: #91a9a8;
    width: 7px;
    height: 50%;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
    transform-origin: bottom center;
}

.powered .wire::before,
.powered .wire .line {
    background: #65f5c0;
    box-shadow: 0 0 8px #65f5c0;
}

.source .wire::before,
.source .wire .line {
    background: #ffd166;
}

.message {
    text-align: center;
    min-height: 28px;
    color: #a9c4d0;
    margin-top: 15px;
}

.message.success {
    color: #65f5c0;
    font-weight: bold;
}

.legend {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 18px;
    color: #9eafbd;
    font-size: 13px;
    margin-top: 15px;
}

.dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 5px;
    background: #65f5c0;
}

@media(max-width: 600px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .panel {
        padding: 12px;
    }
}
</style>
</head>

<body>

<header>
    <h1>CHRISTMAS CIRCUIT</h1>
    <p>Соедини все провода с источником энергии!</p>
</header>

<div class="container">
<div class="panel">

    <div class="stats">
        <div class="stat">
            <span>УРОВЕНЬ</span>
            <strong id="level">1</strong>
        </div>
        <div class="stat">
            <span>ХОДЫ</span>
            <strong id="moves">0</strong>
        </div>
        <div class="stat">
            <span>ВРЕМЯ</span>
            <strong id="timer">00:00</strong>
        </div>
        <div class="stat">
            <span>ОЧКИ</span>
            <strong id="score">1000</strong>
        </div>
    </div>

    <div class="controls">
        <select id="difficulty">
            <option value="easy">Лёгкая</option>
            <option value="medium" selected>Средняя</option>
            <option value="hard">Сложная</option>
        </select>

        <button class="primary" onclick="newGame()">Новая игра</button>
        <button onclick="hint()">Подсказка</button>
        <button onclick="nextLevel()">Следующий уровень</button>
    </div>

    <div id="board"></div>

    <div class="legend">
        <span><i class="dot"></i>Питание подключено</span>
        <span>🟡 Источник энергии</span>
    </div>

    <div class="message" id="message">
        Поверни провода, чтобы подключить всю ёлку!
    </div>

</div>
</div>

<script>
const N = 1;
const E = 2;
const S = 4;
const W = 8;

let tiles = [];
let level = 1;
let moves = 0;
let score = 1000;
let seconds = 0;
let timerInterval = null;
let finished = false;

const board = document.getElementById("board");

function rotate(mask) {
    return ((mask << 1) & 15) | (mask >> 3);
}

function currentMask(tile) {
    let mask = tile.solution;

    for (let i = 0; i < tile.rotation; i++) {
        mask = rotate(mask);
    }

    return mask;
}

function getNeighbours(index) {
    const tile = tiles[index];
    const result = [];

    tiles.forEach((other, otherIndex) => {
        if (other.x === tile.x && other.y === tile.y - 1)
            result.push({index: otherIndex, direction: N, opposite: S});

        if (other.x === tile.x + 1 && other.y === tile.y)
            result.push({index: otherIndex, direction: E, opposite: W});

        if (other.x === tile.x && other.y === tile.y + 1)
            result.push({index: otherIndex, direction: S, opposite: N});

        if (other.x === tile.x - 1 && other.y === tile.y)
            result.push({index: otherIndex, direction: W, opposite: E});
    });

    return result;
}

function createLayout() {
    const difficulty = document.getElementById("difficulty").value;

    if (difficulty === "easy") return [1, 3, 5, 5, 3];
    if (difficulty === "hard") return [1, 3, 5, 7, 9, 9, 7, 5, 3];

    return [1, 3, 5, 7, 7, 5, 3];
}

function buildTiles() {
    tiles = [];

    const layout = createLayout();

    layout.forEach((width, y) => {
        const start = (Math.max(...layout) - width) / 2;

        for (let i = 0; i < width; i++) {
            tiles.push({
                x: start + i,
                y: y,
                solution: 0,
                rotation: 0,
                visualAngle: 0,
                cell: null
            });
        }
    });

    createSolution();
}

function createSolution() {
    const visited = new Set();

    function dfs(index) {
        visited.add(index);

        const neighbours = getNeighbours(index)
            .filter(n => !visited.has(n.index));

        for (let i = neighbours.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [neighbours[i], neighbours[j]] =
                [neighbours[j], neighbours[i]];
        }

        neighbours.forEach(n => {
            if (visited.has(n.index)) return;

            tiles[index].solution |= n.direction;
            tiles[n.index].solution |= n.opposite;

            dfs(n.index);
        });
    }

    dfs(0);

    tiles.forEach((tile, index) => {
        if (index === 0) {
            tile.rotation = 0;
            return;
        }

        tile.rotation = Math.floor(Math.random() * 4);
        tile.visualAngle = tile.rotation * 90;
    });
}

function renderBoard() {
    board.innerHTML = "";

    const layout = createLayout();
    let index = 0;

    layout.forEach((width, y) => {
        const row = document.createElement("div");
        row.className = "tile-row";

        for (let i = 0; i < width; i++) {
            const tileIndex = index++;
            const tile = tiles[tileIndex];

            const cell = document.createElement("div");
            cell.className = "tile";

            if (tileIndex === 0) cell.classList.add("source");

            const rotator = document.createElement("div");
            rotator.className = "wire-rotator";
            rotator.style.transform =
                "rotate(" + tile.visualAngle + "deg)";

            const wire = document.createElement("div");
            wire.className = "wire";

            const mask = tile.solution;

            [N, E, S, W].forEach(direction => {
                if (mask & direction) {
                    const line = document.createElement("div");
                    line.className = "line";

                    if (direction === N) {
                        line.style.transform = "translateX(-50%)";
                    }

                    if (direction === E) {
                        line.style.transform = "translateX(-50%) rotate(90deg)";
                    }

                    if (direction === S) {
                        line.style.transform = "translateX(-50%) rotate(180deg)";
                    }

                    if (direction === W) {
                        line.style.transform = "translateX(-50%) rotate(270deg)";
                    }

                    wire.appendChild(line);
                }
            });

            rotator.appendChild(wire);
            cell.appendChild(rotator);
            row.appendChild(cell);

            tile.cell = cell;
            tile.rotator = rotator;

            cell.addEventListener("click", function() {
                turnTile(tileIndex);
            });
        }

        board.appendChild(row);
    });

    updatePower();
}

function updatePower() {
    const powered = new Set([0]);
    const queue = [0];

    while (queue.length > 0) {
        const index = queue.shift();
        const mask = currentMask(tiles[index]);

        getNeighbours(index).forEach(n => {
            const otherMask = currentMask(tiles[n.index]);

            if ((mask & n.direction) &&
                (otherMask & n.opposite) &&
                !powered.has(n.index)) {
                powered.add(n.index);
                queue.push(n.index);
            }
        });
    }

    tiles.forEach((tile, index) => {
        tile.cell.classList.toggle("powered", powered.has(index));
    });

    if (powered.size === tiles.length && !finished) {
        win();
    }
}

function turnTile(index) {
    if (finished || index === 0) return;

    const tile = tiles[index];

    tile.rotation = (tile.rotation + 1) % 4;
    tile.visualAngle += 90;

    tile.rotator.style.transform =
        "rotate(" + tile.visualAngle + "deg)";

    moves++;
    score = Math.max(0, score - 5);

    updateStats();
    updatePower();
}

function hint() {
    if (finished) return;

    const tile = tiles.find((t, index) =>
        index !== 0 && t.rotation !== 0
    );

    if (!tile) {
        document.getElementById("message").textContent =
            "Подсказка пока не нужна!";
        return;
    }

    const index = tiles.indexOf(tile);
    const turns = (4 - tile.rotation) % 4;

    tile.rotation = 0;
    tile.visualAngle += turns * 90;

    tile.rotator.style.transform =
        "rotate(" + tile.visualAngle + "deg)";

    score = Math.max(0, score - 30);
    moves++;

    updateStats();
    updatePower();
}

function win() {
    finished = true;
    clearInterval(timerInterval);

    score += Math.max(0, 300 - seconds);

    document.getElementById("message").textContent =
        "🎄 Отлично! Вся ёлка подключена! Очки: " + score;

    document.getElementById("message").classList.add("success");

    updateStats();
}

function updateStats() {
    document.getElementById("level").textContent = level;
    document.getElementById("moves").textContent = moves;
    document.getElementById("score").textContent = score;

    const min = String(Math.floor(seconds / 60)).padStart(2, "0");
    const sec = String(seconds % 60).padStart(2, "0");

    document.getElementById("timer").textContent = min + ":" + sec;
}

function startTimer() {
    clearInterval(timerInterval);

    timerInterval = setInterval(() => {
        if (!finished) {
            seconds++;
            updateStats();
        }
    }, 1000);
}

function newGame() {
    finished = false;
    moves = 0;
    seconds = 0;
    score = 1000;

    document.getElementById("message").textContent =
        "Поверни провода, чтобы подключить всю ёлку!";

    document.getElementById("message").classList.remove("success");

    buildTiles();
    renderBoard();
    updateStats();
    startTimer();
}

function nextLevel() {
    if (!finished) {
        document.getElementById("message").textContent =
            "Сначала подключи все провода!";
        return;
    }

    level++;
    newGame();
}

document.getElementById("difficulty").addEventListener("change", newGame);

newGame();
</script>

</body>
</html>
