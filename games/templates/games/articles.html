
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Статьи — PIXEL</title>
</head>
<body>
    <h1>Журнал PIXEL</h1>
    <a href="/">На главную</a>

    {% for article in articles %}
        <article>
            <h2>
                <a href="{% url 'article_detail' article.slug %}">
                    {{ article.title }}
                </a>
            </h2>

            {% if article.cover %}
                <img src="{{ article.cover.url }}" width="300">
            {% endif %}

            <p>{{ article.description }}</p>
        </article>
    {% empty %}
        <p>Пока опубликованных статей нет.</p>
    {% endfor %}
</body>
</html>
