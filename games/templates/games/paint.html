<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXEL Paint Studio</title>

<style>
* { box-sizing: border-box; }

:root {
    --bg: #10111a;
    --panel: #191b29;
    --panel2: #222538;
    --border: #30344c;
    --accent: #8b72ff;
    --text: #f4f3ff;
    --muted: #969bb5;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
}

button, input, select {
    font: inherit;
}

button {
    border: 1px solid var(--border);
    color: var(--text);
    background: var(--panel2);
    border-radius: 9px;
    padding: 9px 12px;
    cursor: pointer;
    transition: .15s;
}

button:hover {
    background: #343954;
    border-color: #7665d9;
}

button:disabled {
    opacity: .35;
    cursor: default;
}

button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
}

.header {
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    background: #171927;
    border-bottom: 1px solid var(--border);
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

.logo span {
    color: #a28dff;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.status {
    color: var(--muted);
    font-size: 12px;
    margin-right: 10px;
}

.workspace {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    min-height: calc(100vh - 65px);
}

.sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 15px;
}

.section-title {
    color: var(--muted);
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1.2px;
    margin: 10px 0;
}

.tools {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
}

.tool {
    min-height: 65px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-size: 12px;
    padding: 7px 3px;
}

.tool .emoji{font-size:21px}.layer-list{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto}.layer-item{display:flex;align-items:center;gap:6px;padding:7px;border:1px solid var(--border);border-radius:8px;background:#222538}.layer-item.active{border-color:var(--accent);background:#30294f}.layer-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;text-align:left}

.tool.active {
    background: #5141a2;
    border-color: #a08aff;
}

.setting {
    background: #222538;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px;
    margin-bottom: 10px;
}

.setting label {
    display: flex;
    justify-content: space-between;
    color: #c4c7d8;
    font-size: 12px;
    margin-bottom: 9px;
}

input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
}

input[type="color"] {
    width: 100%;
    height: 39px;
    border: 0;
    background: transparent;
    cursor: pointer;
}

.palette {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
}

.swatch {
    width: 100%;
    aspect-ratio: 1;
    padding: 0;
    border-radius: 7px;
    border: 2px solid #ffffff22;
}

.swatch:hover {
    transform: scale(1.08);
}

.main {
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.topbar {
    min-height: 57px;
    background: #171927;
    border-bottom: 1px solid var(--border);
    padding: 9px 15px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.topbar .separator {
    height: 27px;
    width: 1px;
    background: var(--border);
    margin: 0 4px;
}

.topbar button {
    padding: 8px 11px;
    font-size: 13px;
}

.topbar .danger:hover {
    background: #823b54;
}

.canvas-stage {
    flex: 1;
    min-height: 400px;
    background-color: #12141e;
    background-image:
        radial-gradient(#ffffff0c 1px, transparent 1px);
    background-size: 20px 20px;
    padding: 25px;
    overflow: auto;
    display: flex;
    align-items: flex-start;
    justify-content: center;
}

.canvas-frame {
    background: #fff;
    box-shadow: 0 15px 50px #0008;
    flex: none;
    line-height: 0;
    position: relative;
}
.canvas-frame.grid-on::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(to right, #64748b55 1px, transparent 1px),
        linear-gradient(to bottom, #64748b55 1px, transparent 1px);
    background-size: 50px 50px;
}

canvas {
    display: block;
    background: white;
    touch-action: none;
    cursor: crosshair;
}

.bottom-bar {
    height: 40px;
    background: #191b29;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    color: var(--muted);
    font-size: 12px;
}

.bottom-bar button {
    padding: 5px 9px;
    font-size: 12px;
}

.hidden {
    display: none !important;
}

@media(max-width: 800px) {
    .workspace {
        grid-template-columns: 1fr;
    }

    .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--border);
        padding: 10px;
    }

    .tools {
        grid-template-columns: repeat(5, 1fr);
    }

    .tool {
        min-height: 57px;
    }

    .settings-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .section-title {
        margin-top: 7px;
    }

    .canvas-stage {
        min-height: 380px;
        padding: 12px;
        justify-content: flex-start;
    }

    .header {
        padding: 0 12px;
    }

    .status {
        display: none;
    }
}

@media(max-width: 430px) {
    .tools {
        grid-template-columns: repeat(4, 1fr);
    }

    .tool {
        font-size: 11px;
    }

    .topbar {
        gap: 5px;
        padding: 8px;
    }

    .topbar button {
        padding: 8px;
        font-size: 12px;
    }

    .canvas-stage {
        min-height: 330px;
    }
}
</style>
</head>

    <div class="setting"><label>Второй цвет градиента</label><input type="color" id="gradientColor" value="#ffffff"></div><div class="section-title">СЛОИ</div><div class="setting"><div id="layerList" class="layer-list"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><button id="addLayer">＋ Слой</button><button id="renameLayer">✎ Имя</button><button id="moveLayerUp">↑ Вверх</button><button id="moveLayerDown">↓ Вниз</button><button id="deleteLayer" style="grid-column:1/-1">Удалить слой</button></div></div><div class="section-title">БЫСТРАЯ ПАЛИТРА</div>

<input type="file" id="imageFile" accept="image/*" class="hidden">
<input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2" class="hidden"><input type="file" id="projectFile" accept=".pixelpaint,application/json,.json" class="hidden">

<script>
const canvas = document.getElementById("canvas");
const displayCtx=canvas.getContext("2d",{willReadFrequently:true});let layers=[],activeLayerId=1,nextLayerId=1,ctx;
function makeLayer(name){const surface=document.createElement("canvas");surface.width=canvas.width;surface.height=canvas.height;return{id:nextLayerId++,name,surface,context:surface.getContext("2d",{willReadFrequently:true}),visible:true};}
function activeLayer(){return layers.find(l=>l.id===activeLayerId)||layers[0]}function setActiveLayer(){ctx=activeLayer().context}function renderLayers(){displayCtx.clearRect(0,0,canvas.width,canvas.height);layers.forEach(l=>{if(l.visible)displayCtx.drawImage(l.surface,0,0)})}
function renderLayerList(){const list=document.getElementById("layerList");if(!list)return;list.innerHTML="";[...layers].reverse().forEach(l=>{const row=document.createElement("div");row.className="layer-item"+(l.id===activeLayerId?" active":"");const eye=document.createElement("button");eye.textContent=l.visible?"◉":"○";eye.onclick=e=>{e.stopPropagation();l.visible=!l.visible;renderLayers();renderLayerList();saveState()};const name=document.createElement("button");name.className="layer-name";name.textContent=l.name;name.onclick=()=>{activeLayerId=l.id;setActiveLayer();renderLayerList()};row.append(eye,name);list.append(row)});const i=layers.findIndex(l=>l.id===activeLayerId);document.getElementById("deleteLayer").disabled=layers.length<2;document.getElementById("moveLayerUp").disabled=i===layers.length-1;document.getElementById("moveLayerDown").disabled=i===0}
layers=[makeLayer("Фон")];activeLayerId=layers[0].id;setActiveLayer();

const colorInput = document.getElementById("color");
const sizeInput = document.getElementById("size");
const opacityInput = document.getElementById("opacity");

const sizeValue = document.getElementById("sizeValue");
const opacityValue = document.getElementById("opacityValue");

let tool = "brush";
let drawing = false;
let startX = 0;
let startY = 0;
let lastX = 0;
let lastY = 0;
let zoom = 1;

let history = [];
let historyIndex = -1;
const MAX_HISTORY = 25;

let previewImage = null;

const toolNames = {
    brush: "Кисть",
    eraser: "Ластик",
    fill: "Заливка",
    picker: "Пипетка",
    line: "Линия",
    rectangle: "Прямоугольник",
    circle: "Круг",
    triangle: "Треугольник",
    text: "Текст",
    gradient: "Градиент",
    star: "Звезда",
    diamond: "Ромб",
    semicircle: "Полукруг", roundedRect: "Скруглённый прямоугольник", arrow: "Стрелка", spray: "Аэрограф"
};

// --------------------
// ПОЛЬЗОВАТЕЛЬСКИЕ ШРИФТЫ
// --------------------

const fontSelect = document.getElementById("fontFamily");
const fontFile = document.getElementById("fontFile");
const uploadFontButton = document.getElementById("uploadFont");
const deleteFontButton = document.getElementById("deleteFont");
const customFontFaces = new Map();
let fontDatabase = null;

function openFontDatabase() {
    return new Promise((resolve, reject) => {
        if (!("indexedDB" in window)) {
            reject(new Error("IndexedDB недоступен"));
            return;
        }
        const request = indexedDB.open("pixel-paint-fonts", 1);
        request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains("fonts")) {
                db.createObjectStore("fonts", {keyPath: "name"});
            }
        };
        request.onsuccess = () => {
            fontDatabase = request.result;
            resolve(fontDatabase);
        };
        request.onerror = () => reject(request.error);
    });
}

function fontTransaction(mode, action) {
    return new Promise((resolve, reject) => {
        if (!fontDatabase) return reject(new Error("Хранилище шрифтов не открыто"));
        const transaction = fontDatabase.transaction("fonts", mode);
        const request = action(transaction.objectStore("fonts"));
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}

function addFontOption(name) {
    if ([...fontSelect.options].some(option => option.value === name)) return;
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name + " · мой шрифт";
    option.dataset.custom = "true";
    fontSelect.appendChild(option);
}

async function installCustomFont(name, data) {
    const face = new FontFace(name, data);
    await face.load();
    document.fonts.add(face);
    customFontFaces.set(name, face);
    addFontOption(name);
}

async function loadSavedFonts() {
    try {
        await openFontDatabase();
        const fonts = await fontTransaction("readonly", store => store.getAll());
        for (const font of fonts || []) {
            try {
                await installCustomFont(font.name, font.data);
            } catch (error) {
                console.warn("Не удалось загрузить шрифт:", font.name, error);
            }
        }
    } catch (error) {
        console.warn("Хранилище пользовательских шрифтов недоступно:", error);
    }
}

uploadFontButton.addEventListener("click", () => fontFile.click());

fontFile.addEventListener("change", async function() {
    const file = this.files && this.files[0];
    this.value = "";
    if (!file) return;

    const extension = file.name.split(".").pop().toLowerCase();
    if (!["ttf", "otf", "woff", "woff2"].includes(extension)) {
        alert("Выбери файл шрифта TTF, OTF, WOFF или WOFF2.");
        return;
    }

    let baseName = file.name.replace(/\\.(ttf|otf|woff2?)$/i, "")
        .replace(/[^\\p{L}\\p{N}_ -]/gu, "").trim().slice(0, 40) || "Мой шрифт";
    let name = baseName;
    let suffix = 2;
    while ([...fontSelect.options].some(option => option.value === name)) {
        name = baseName + " " + suffix++;
    }

    try {
        const data = await file.arrayBuffer();
        await installCustomFont(name, data);
        await fontTransaction("readwrite", store => store.put({name, data}));
        fontSelect.value = name;
        deleteFontButton.disabled = false;
        alert("Шрифт «" + name + "» добавлен! Теперь выбери инструмент «Текст».");
    } catch (error) {
        console.error(error);
        alert("Не удалось загрузить этот шрифт. Попробуй другой файл TTF или OTF.");
    }
});

fontSelect.addEventListener("change", function() {
    deleteFontButton.disabled = !customFontFaces.has(this.value);
});

deleteFontButton.addEventListener("click", async function() {
    const name = fontSelect.value;
    if (!customFontFaces.has(name)) return;
    if (!confirm("Удалить шрифт «" + name + "» из PIXEL Paint?")) return;

    try {
        await fontTransaction("readwrite", store => store.delete(name));
        document.fonts.delete(customFontFaces.get(name));
        customFontFaces.delete(name);
        const option = [...fontSelect.options].find(item => item.value === name);
        if (option) option.remove();
        fontSelect.value = "Arial";
        deleteFontButton.disabled = true;
    } catch (error) {
        alert("Не получилось удалить шрифт.");
    }
});

loadSavedFonts();

// --------------------
// ХОЛСТ
// --------------------

function resetCanvas(){layers.forEach(l=>l.context.clearRect(0,0,canvas.width,canvas.height));layers[0].context.fillStyle="#ffffff";layers[0].context.fillRect(0,0,canvas.width,canvas.height);setActiveLayer();renderLayers()}

function saveState() {
    if (historyIndex < history.length - 1) {
        history = history.slice(0, historyIndex + 1);
    }

    history.push(layers.map((l,order)=>({id:l.id,order,name:l.name,visible:l.visible,data:l.surface.toDataURL("image/png")})));

    if (history.length > MAX_HISTORY) {
        history.shift();
    }

    historyIndex = history.length - 1;
    updateHistoryButtons();
}

// --------------------
// КООРДИНАТЫ
// --------------------

function getPosition(event) {
    const rect = canvas.getBoundingClientRect();

    return {
        x: Math.max(0, Math.min(canvas.width,
            (event.clientX - rect.left) * canvas.width / rect.width)),
        y: Math.max(0, Math.min(canvas.height,
            (event.clientY - rect.top) * canvas.height / rect.height))
    };
}

// --------------------
// ОБЩИЕ НАСТРОЙКИ КИСТИ
// --------------------

function applyStyle() {
    const brush=document.getElementById("brushType").value;ctx.lineWidth=Number(sizeInput.value);ctx.lineCap=brush==="square"?"square":"round";ctx.lineJoin="round";ctx.strokeStyle=colorInput.value;ctx.fillStyle=colorInput.value;ctx.globalAlpha=Number(opacityInput.value)/100*(brush==="marker"?.42:1);
}

// --------------------
// НАЧАЛО РИСОВАНИЯ
// --------------------

function startDrawing(event) {
    if (event.button !== undefined && event.button !== 0) return;

    event.preventDefault();

    const pos = getPosition(event);

    startX = pos.x;
    startY = pos.y;
    lastX = pos.x;
    lastY = pos.y;

    if (tool === "picker") {
        const pixel = displayCtx.getImageData(
            Math.floor(pos.x), Math.floor(pos.y), 1, 1
        ).data;

        colorInput.value = rgbToHex(pixel[0], pixel[1], pixel[2]);
        return;
    }

    if (tool === "fill") {
        floodFill(Math.floor(pos.x), Math.floor(pos.y));
        renderLayers();saveState();
        return;
    }

    if (tool === "text") {
        const value = prompt("Введите текст:");
        if (value !== null && value.trim() !== "") {
            applyStyle();
            const selectedFont = document.getElementById("fontFamily").value || "Arial";
            ctx.font = "bold " + document.getElementById("fontSize").value + 'px "' + selectedFont.replace(/"/g, "") + '"';
            ctx.textBaseline = "top";
            ctx.fillText(value, pos.x, pos.y);
            ctx.globalAlpha = 1;
            renderLayers();saveState();
        }
        return;
    }

    drawing = true;

    if (["line", "rectangle", "circle", "semicircle", "triangle", "star", "diamond", "gradient", "roundedRect", "arrow"].includes(tool)) {
        previewImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
    } else {
        applyStyle();
        if (tool === "spray") sprayAt(pos.x,pos.y);
        else if (tool === "eraser") {
            ctx.globalCompositeOperation = "destination-out";
        }

        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.lineTo(pos.x + 0.1, pos.y + 0.1);
        ctx.stroke();
        if (document.getElementById("symmetry").checked) {
            ctx.save();
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            ctx.lineTo(pos.x + 0.1, pos.y + 0.1);
            ctx.stroke();
            ctx.restore();
        }

        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
    }

    try {
        canvas.setPointerCapture(event.pointerId);
    } catch(e) {}
}

// --------------------
// ДВИЖЕНИЕ
// --------------------

function draw(event) {
    if (!drawing) return;

    event.preventDefault();

    const pos = getPosition(event);

    if (["line", "rectangle", "circle", "semicircle", "triangle", "star", "diamond", "gradient", "roundedRect", "arrow"].includes(tool)) {
        ctx.putImageData(previewImage, 0, 0);
        drawShape(startX, startY, pos.x, pos.y);
        renderLayers();return;
    }

    applyStyle();
    if(tool==="spray"){sprayAt(pos.x,pos.y);renderLayers();lastX=pos.x;lastY=pos.y;return;}
    if (tool === "eraser") ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    if (document.getElementById("symmetry").checked) {
        ctx.save();
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        ctx.restore();
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    renderLayers();

    lastX = pos.x;
    lastY = pos.y;
}

// --------------------
// ФИГУРЫ
// --------------------

function drawShape(x1, y1, x2, y2, mirrored = false) {
    applyStyle();

    const mode = document.getElementById("shapeMode").value;

    ctx.beginPath();

    if (tool === "line") {
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    }

    if(tool==="roundedRect"){const x=Math.min(x1,x2),y=Math.min(y1,y2),w=Math.abs(x2-x1),h=Math.abs(y2-y1),r=Math.min(24,w/2,h/2);ctx.roundRect(x,y,w,h,r);if(mode==="fill")ctx.fill();else ctx.stroke();}
    if(tool==="arrow"){const a=Math.atan2(y2-y1,x2-x1),head=Math.max(14,Number(sizeInput.value)*3);ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.moveTo(x2,y2);ctx.lineTo(x2-head*Math.cos(a-Math.PI/6),y2-head*Math.sin(a-Math.PI/6));ctx.moveTo(x2,y2);ctx.lineTo(x2-head*Math.cos(a+Math.PI/6),y2-head*Math.sin(a+Math.PI/6));ctx.stroke();}
    if (tool === "rectangle") {
        const x = Math.min(x1, x2);
        const y = Math.min(y1, y2);
        const w = Math.abs(x2 - x1);
        const h = Math.abs(y2 - y1);

        if (mode === "fill") {
            ctx.fillRect(x, y, w, h);
        } else {
            ctx.strokeRect(x, y, w, h);
        }
    }

    if (tool === "circle") {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const radius = Math.sqrt(dx * dx + dy * dy);

        ctx.arc(x1, y1, radius, 0, Math.PI * 2);

        if (mode === "fill") ctx.fill();
        else ctx.stroke();
    }

    if (tool === "triangle") {
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineTo(x1 - (x2 - x1), y2);
        ctx.closePath();

        if (mode === "fill") ctx.fill();
        else ctx.stroke();
    }

    if (tool === "diamond") {
        const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
        ctx.moveTo(cx, y1); ctx.lineTo(x2, cy);
        ctx.lineTo(cx, y2); ctx.lineTo(x1, cy); ctx.closePath();
        if (mode === "fill") ctx.fill(); else ctx.stroke();
    }

    if (tool === "star") {
        const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
        const outer = Math.max(2, Math.hypot(x2-x1, y2-y1)/2);
        const inner = outer * 0.42;
        for (let i = 0; i < 10; i++) {
            const radius = i % 2 === 0 ? outer : inner;
            const angle = -Math.PI/2 + i*Math.PI/5;
            const px = cx + Math.cos(angle)*radius;
            const py = cy + Math.sin(angle)*radius;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        if (mode === "fill") ctx.fill(); else ctx.stroke();
    }

    if(tool==="semicircle"){const cx=(x1+x2)/2,cy=(y1+y2)/2,rx=Math.abs(x2-x1)/2,ry=Math.abs(y2-y1)/2;ctx.ellipse(cx,cy,Math.max(1,rx),Math.max(1,ry),0,Math.PI,0);if(mode==="fill"){ctx.lineTo(cx-rx,cy);ctx.closePath();ctx.fill()}else ctx.stroke()}
    if (tool === "gradient") {
        const gradient = ctx.createLinearGradient(x1, y1, x2, y2);
        gradient.addColorStop(0, colorInput.value);
        gradient.addColorStop(1, document.getElementById("gradientColor").value);
        ctx.fillStyle = gradient;
        ctx.globalAlpha = Number(opacityInput.value) / 100;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    if (!mirrored && tool !== "gradient" && document.getElementById("symmetry").checked) {
        ctx.save();
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        drawShape(x1, y1, x2, y2, true);
        ctx.restore();
    }

    ctx.globalAlpha = 1;
}

// --------------------
// ЗАВЕРШЕНИЕ
// --------------------

function stopDrawing(event) {
    if (!drawing) return;

    const pos = event ? getPosition(event) : {x:lastX, y:lastY};

    if (["line", "rectangle", "circle", "semicircle", "triangle", "star", "diamond", "gradient", "roundedRect", "arrow"].includes(tool)) {
        ctx.putImageData(previewImage, 0, 0);
        drawShape(startX, startY, pos.x, pos.y);
    }

    drawing = false;
    previewImage = null;

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    renderLayers();saveState();
}

// --------------------
// ЗАЛИВКА
// --------------------

function floodFill(startX, startY) {
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;

    const width = canvas.width;
    const height = canvas.height;

    const start = (startY * width + startX) * 4;

    const oldR = data[start];
    const oldG = data[start + 1];
    const oldB = data[start + 2];
    const oldA = data[start + 3];

    const color = hexToRgb(colorInput.value);
    const alpha = Number(opacityInput.value) / 100;

    if (
        Math.abs(oldR - color.r) < 2 &&
        Math.abs(oldG - color.g) < 2 &&
        Math.abs(oldB - color.b) < 2 &&
        oldA === 255 && alpha === 1
    ) return;

    const stack = [[startX, startY]];
    const visited = new Uint8Array(width * height);
    const tolerance = Number(document.getElementById("fillTolerance").value);

    while (stack.length) {
        const point = stack.pop();
        const x = point[0];
        const y = point[1];

        if (x < 0 || x >= width || y < 0 || y >= height) continue;

        const pixel = y * width + x;
        if (visited[pixel]) continue;

        visited[pixel] = 1;

        const i = pixel * 4;

        if (
            Math.abs(data[i] - oldR) > tolerance ||
            Math.abs(data[i + 1] - oldG) > tolerance ||
            Math.abs(data[i + 2] - oldB) > tolerance ||
            Math.abs(data[i + 3] - oldA) > tolerance
        ) continue;

        data[i] = color.r * alpha + data[i] * (1 - alpha);
        data[i + 1] = color.g * alpha + data[i + 1] * (1 - alpha);
        data[i + 2] = color.b * alpha + data[i + 2] * (1 - alpha);
        data[i + 3] = 255;

        stack.push(
            [x + 1, y],
            [x - 1, y],
            [x, y + 1],
            [x, y - 1]
        );
    }

    ctx.putImageData(imageData, 0, 0);
    renderLayers();
}

function sprayAt(x,y){const radius=Math.max(5,Number(sizeInput.value)*1.8),dots=Math.max(18,Math.round(radius*2));ctx.save();ctx.globalAlpha=Number(opacityInput.value)/100*.35;ctx.fillStyle=colorInput.value;for(let i=0;i<dots;i++){const a=Math.random()*Math.PI*2,d=Math.sqrt(Math.random())*radius;ctx.beginPath();ctx.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,Math.max(1,Number(sizeInput.value)/9),0,Math.PI*2);ctx.fill()}ctx.restore()}
function rgbToHex(r, g, b) {
    return "#" + [r, g, b].map(v =>
        Math.round(v).toString(16).padStart(2, "0")
    ).join("");
}

function hexToRgb(hex) {
    return {
        r: parseInt(hex.slice(1, 3), 16),
        g: parseInt(hex.slice(3, 5), 16),
        b: parseInt(hex.slice(5, 7), 16)
    };
}

function applyFilter(type) {
    const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = image.data;
    for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i + 1], b = data[i + 2];
        if (type === "gray") {
            const v = 0.299 * r + 0.587 * g + 0.114 * b;
            data[i] = data[i + 1] = data[i + 2] = v;
        } else if (type === "sepia") {
            data[i] = Math.min(255, 0.393*r + 0.769*g + 0.189*b);
            data[i + 1] = Math.min(255, 0.349*r + 0.686*g + 0.168*b);
            data[i + 2] = Math.min(255, 0.272*r + 0.534*g + 0.131*b);
        } else if (type === "invert") {
            data[i] = 255-r;
            data[i + 1] = 255-g;
            data[i + 2] = 255-b;
        }
    }
    ctx.putImageData(image, 0, 0);
    renderLayers();saveState();
}

function setZoom(value) {
    zoom = Math.max(0.25, Math.min(2, value));

    canvas.style.width = (canvas.width * zoom) + "px";
    canvas.style.height = (canvas.height * zoom) + "px";

    document.getElementById("zoomLabel").textContent =
        Math.round(zoom * 100) + "%";
}

            resetCanvas();

            const scale = Math.min(
                canvas.width / image.width,
                canvas.height / image.height
            );

            const w = image.width * scale;
            const h = image.height * scale;

            ctx.drawImage(
                image,
                (canvas.width - w) / 2,
                (canvas.height - h) / 2,
                w,
                h
            );

            renderLayers();saveState();
        };

        image.src = e.target.result;
    };

    reader.readAsDataURL(file);
    this.value = "";
});

// --------------------
// СОХРАНЕНИЕ
// --------------------

function downloadImage(type) {
    let link = document.createElement("a");

    if (type === "png") {
        link.download = "pixel_paint.png";
        link.href = canvas.toDataURL("image/png");
    } else {
        const temp = document.createElement("canvas");
        temp.width = canvas.width;
        temp.height = canvas.height;

        const tempCtx = temp.getContext("2d");
        tempCtx.fillStyle = "#ffffff";
        tempCtx.fillRect(0, 0, temp.width, temp.height);
        tempCtx.drawImage(canvas, 0, 0);

        link.download = "pixel_paint.jpg";
        link.href = temp.toDataURL("image/jpeg", 0.95);
    }

    link.click();
}

document.getElementById("savePNG").addEventListener("click", () => downloadImage("png"));
document.getElementById("addLayer").onclick=()=>{const l=makeLayer("Слой "+nextLayerId);layers.push(l);activeLayerId=l.id;setActiveLayer();renderLayers();renderLayerList();saveState()};
document.getElementById("renameLayer").onclick=()=>{const l=activeLayer(),n=prompt("Название слоя:",l.name);if(n&&n.trim()){l.name=n.trim().slice(0,32);renderLayerList();saveState()}};
document.getElementById("deleteLayer").onclick=()=>{if(layers.length<2||!confirm("Удалить выбранный слой?"))return;const i=layers.findIndex(l=>l.id===activeLayerId);layers.splice(i,1);activeLayerId=layers[Math.max(0,i-1)].id;setActiveLayer();renderLayers();renderLayerList();saveState()};
function moveLayer(d){const i=layers.findIndex(l=>l.id===activeLayerId),j=i+d;if(j<0||j>=layers.length)return;[layers[i],layers[j]]=[layers[j],layers[i]];renderLayers();renderLayerList();saveState()};document.getElementById("moveLayerUp").onclick=()=>moveLayer(1);document.getElementById("moveLayerDown").onclick=()=>moveLayer(-1);

const jpgButton = document.createElement("button");
jpgButton.textContent = "JPG";
jpgButton.addEventListener("click", () => downloadImage("jpg"));
document.querySelector(".header-right").appendChild(jpgButton);

// --------------------
// ГОРЯЧИЕ КЛАВИШИ
// --------------------

document.addEventListener("keydown", function(event) {
    const key = event.key.toLowerCase();

    if (event.ctrlKey && key === "z") {
        event.preventDefault();
        document.getElementById("undo").click();
    }

    if (event.ctrlKey && key === "y") {
        event.preventDefault();
        document.getElementById("redo").click();
    }

    if (event.ctrlKey && key === "s") {
        event.preventDefault();
        downloadImage("png");
    }

    if (event.key === "Escape" && drawing) {
        drawing = false;
        previewImage = null;
        restoreState(historyIndex);
    }
});

setZoom(1);renderLayers();renderLayerList();
</script>
