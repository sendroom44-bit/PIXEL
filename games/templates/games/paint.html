<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXEL Paint Studio</title>

<style>
* { box-sizing: border-box; }

:root {
    --bg: #10111a;
    --panel: #191b29;
    --panel2: #222538;
    --border: #30344c;
    --accent: #8b72ff;
    --text: #f4f3ff;
    --muted: #969bb5;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
}

button, input, select {
    font: inherit;
}

button {
    border: 1px solid var(--border);
    color: var(--text);
    background: var(--panel2);
    border-radius: 9px;
    padding: 9px 12px;
    cursor: pointer;
    transition: .15s;
}

button:hover {
    background: #343954;
    border-color: #7665d9;
}

button:disabled {
    opacity: .35;
    cursor: default;
}

button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
}

.header {
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    background: #171927;
    border-bottom: 1px solid var(--border);
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

.logo span {
    color: #a28dff;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.status {
    color: var(--muted);
    font-size: 12px;
    margin-right: 10px;
}

.workspace {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    min-height: calc(100vh - 65px);
}

.sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 15px;
}

.section-title {
    color: var(--muted);
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1.2px;
    margin: 10px 0;
}

.tools {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
}

.tool {
    min-height: 65px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-size: 12px;
    padding: 7px 3px;
}

.tool .emoji {
    font-size: 21px;
}

.tool.active {
    background: #5141a2;
    border-color: #a08aff;
}

.setting {
    background: #222538;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px;
    margin-bottom: 10px;
}

.setting label {
    display: flex;
    justify-content: space-between;
    color: #c4c7d8;
    font-size: 12px;
    margin-bottom: 9px;
}

input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
}

input[type="color"] {
    width: 100%;
    height: 39px;
    border: 0;
    background: transparent;
    cursor: pointer;
}

.palette {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
}

.swatch {
    width: 100%;
    aspect-ratio: 1;
    padding: 0;
    border-radius: 7px;
    border: 2px solid #ffffff22;
}

.swatch:hover {
    transform: scale(1.08);
}

.main {
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.topbar {
    min-height: 57px;
    background: #171927;
    border-bottom: 1px solid var(--border);
    padding: 9px 15px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.topbar .separator {
    height: 27px;
    width: 1px;
    background: var(--border);
    margin: 0 4px;
}

.topbar button {
    padding: 8px 11px;
    font-size: 13px;
}

.topbar .danger:hover {
    background: #823b54;
}

.canvas-stage {
    flex: 1;
    min-height: 400px;
    background-color: #12141e;
    background-image:
        radial-gradient(#ffffff0c 1px, transparent 1px);
    background-size: 20px 20px;
    padding: 25px;
    overflow: auto;
    display: flex;
    align-items: flex-start;
    justify-content: center;
}

.canvas-frame {
    background: #fff;
    box-shadow: 0 15px 50px #0008;
    flex: none;
    line-height: 0;
    position: relative;
}
.canvas-frame.grid-on::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(to right, #64748b55 1px, transparent 1px),
        linear-gradient(to bottom, #64748b55 1px, transparent 1px);
    background-size: 50px 50px;
}

canvas {
    display: block;
    background: white;
    touch-action: none;
    cursor: crosshair;
}

.bottom-bar {
    height: 40px;
    background: #191b29;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    color: var(--muted);
    font-size: 12px;
}

.bottom-bar button {
    padding: 5px 9px;
    font-size: 12px;
}

.hidden {
    display: none !important;
}

@media(max-width: 800px) {
    .workspace {
        grid-template-columns: 1fr;
    }

    .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--border);
        padding: 10px;
    }

    .tools {
        grid-template-columns: repeat(5, 1fr);
    }

    .tool {
        min-height: 57px;
    }

    .settings-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .section-title {
        margin-top: 7px;
    }

    .canvas-stage {
        min-height: 380px;
        padding: 12px;
        justify-content: flex-start;
    }

    .header {
        padding: 0 12px;
    }

    .status {
        display: none;
    }
}

@media(max-width: 430px) {
    .tools {
        grid-template-columns: repeat(4, 1fr);
    }

    .tool {
        font-size: 11px;
    }

    .topbar {
        gap: 5px;
        padding: 8px;
    }

    .topbar button {
        padding: 8px;
        font-size: 12px;
    }

    .canvas-stage {
        min-height: 330px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">🎨 PIXEL <span>Paint Studio</span></div>
    <div class="header-right">
        <span class="status">CREATIVE WORKSPACE</span>
        <button id="openImage">📂 Открыть</button>
        <button id="savePNG">💾 PNG</button>
    </div>
</header>

<div class="workspace">

<aside class="sidebar">

    <div class="section-title">ИНСТРУМЕНТЫ</div>

    <div class="tools">
        <button class="tool active" data-tool="brush">
            <span class="emoji">🖌️</span>Кисть
        </button>
        <button class="tool" data-tool="eraser">
            <span class="emoji">🧽</span>Ластик
        </button>
        <button class="tool" data-tool="fill">
            <span class="emoji">🪣</span>Заливка
        </button>
        <button class="tool" data-tool="picker">
            <span class="emoji">💧</span>Пипетка
        </button>
        <button class="tool" data-tool="line">
            <span class="emoji">📏</span>Линия
        </button>
        <button class="tool" data-tool="rectangle">
            <span class="emoji">▭</span>Прямоугольник
        </button>
        <button class="tool" data-tool="circle">
            <span class="emoji">⭕</span>Круг
        </button>
        <button class="tool" data-tool="triangle">
            <span class="emoji">△</span>Треугольник
        </button>
        <button class="tool" data-tool="text">
            <span class="emoji">T</span>Текст
        </button>
        <button class="tool" data-tool="gradient"><span class="emoji">🌈</span>Градиент</button>
        <button class="tool" data-tool="star"><span class="emoji">⭐</span>Звезда</button>
        <button class="tool" data-tool="diamond"><span class="emoji">◇</span>Ромб</button>
    </div>

    <div class="section-title">ЦВЕТ</div>

    <div class="setting">
        <label>Основной цвет</label>
        <input type="color" id="color" value="#795cff">
    </div>

    <div class="section-title">БЫСТРАЯ ПАЛИТРА</div>

    <div class="setting">
        <div class="palette" id="palette">
            <button class="swatch" data-color="#171717" style="background:#171717"></button>
            <button class="swatch" data-color="#ffffff" style="background:#ffffff"></button>
            <button class="swatch" data-color="#ff4242" style="background:#ff4242"></button>
            <button class="swatch" data-color="#ff9f43" style="background:#ff9f43"></button>
            <button class="swatch" data-color="#ffe66d" style="background:#ffe66d"></button>
            <button class="swatch" data-color="#54d68b" style="background:#54d68b"></button>
            <button class="swatch" data-color="#35c9e8" style="background:#35c9e8"></button>
            <button class="swatch" data-color="#3978ff" style="background:#3978ff"></button>
            <button class="swatch" data-color="#795cff" style="background:#795cff"></button>
            <button class="swatch" data-color="#ed5bd5" style="background:#ed5bd5"></button>
        </div>
    </div>

    <div class="section-title">НАСТРОЙКИ</div>

    <div class="settings-grid">
        <div class="setting">
            <label>Размер <span id="sizeValue">8 px</span></label>
            <input type="range" id="size" min="1" max="100" value="8">
        </div>

        <div class="setting">
            <label>Прозрачность <span id="opacityValue">100%</span></label>
            <input type="range" id="opacity" min="5" max="100" value="100">
        </div>
    </div>

    <div class="setting">
        <label style="align-items:center; margin:0; cursor:pointer">
            <span>Зеркальное рисование</span>
            <input type="checkbox" id="symmetry" style="accent-color:var(--accent)">
        </label>
    </div>

    <div class="setting">
        <label>Форма</label>
        <select id="shapeMode" style="width:100%;background:#30344c;color:white;border:0;padding:9px;border-radius:7px">
            <option value="stroke">Контур</option>
            <option value="fill">Заливка</option>
        </select>
    </div>

    <div class="setting">
        <label>Размер текста</label>
        <select id="fontSize" style="width:100%;background:#30344c;color:white;border:0;padding:9px;border-radius:7px">
            <option value="18">18 px</option>
            <option value="24" selected>24 px</option>
            <option value="36">36 px</option>
            <option value="48">48 px</option>
            <option value="64">64 px</option>
            <option value="96">96 px</option>
        </select>
    </div>

</aside>

<main class="main">

    <div class="topbar">
        <button id="undo">↶ Отмена</button>
        <button id="redo">↷ Повтор</button>

        <div class="separator"></div>

        <button id="clear" class="danger">🗑 Очистить</button>
        <button id="newCanvas">＋ Новый холст</button>
        <button id="toggleGrid">▦ Сетка</button>
        <button id="flipHorizontal">↔ Отразить</button>
        <button id="flipVertical">↕ Перевернуть</button>
        <button id="rotateCanvas">⟳ Поворот 90°</button>
        <button id="filterGray">Ч/Б</button>
        <button id="filterSepia">Сепия</button>
        <button id="filterInvert">Инверсия</button>

        <div class="separator"></div>

        <button id="zoomOut">－</button>
        <button id="zoomLabel">100%</button>
        <button id="zoomIn">＋</button>
        <button id="zoomReset">Сброс</button>
    </div>

    <div class="canvas-stage" id="canvasStage">
        <div class="canvas-frame">
            <canvas id="canvas" width="1200" height="750"></canvas>
        </div>
    </div>

    <div class="bottom-bar">
        <span id="canvasInfo">1200 × 750 px</span>
        <span>PIXEL STUDIO · <span id="toolInfo">Кисть</span></span>
        <button onclick="location.href='/'">🏠 Главная</button>
    </div>

</main>
</div>

<input type="file" id="imageFile" accept="image/*" class="hidden">

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {willReadFrequently:true});

const colorInput = document.getElementById("color");
const sizeInput = document.getElementById("size");
const opacityInput = document.getElementById("opacity");

const sizeValue = document.getElementById("sizeValue");
const opacityValue = document.getElementById("opacityValue");

let tool = "brush";
let drawing = false;
let startX = 0;
let startY = 0;
let lastX = 0;
let lastY = 0;
let zoom = 1;

let history = [];
let historyIndex = -1;
const MAX_HISTORY = 25;

let previewImage = null;

const toolNames = {
    brush: "Кисть",
    eraser: "Ластик",
    fill: "Заливка",
    picker: "Пипетка",
    line: "Линия",
    rectangle: "Прямоугольник",
    circle: "Круг",
    triangle: "Треугольник",
    text: "Текст",
    gradient: "Градиент",
    star: "Звезда",
    diamond: "Ромб"
};

// --------------------
// ХОЛСТ
// --------------------

function resetCanvas() {
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function saveState() {
    if (historyIndex < history.length - 1) {
        history = history.slice(0, historyIndex + 1);
    }

    history.push(canvas.toDataURL("image/png"));

    if (history.length > MAX_HISTORY) {
        history.shift();
    }

    historyIndex = history.length - 1;
    updateHistoryButtons();
}

function restoreState(index) {
    if (index < 0 || index >= history.length) return;

    const image = new Image();

    image.onload = function() {
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(image, 0, 0);
    };

    image.src = history[index];
}

function updateHistoryButtons() {
    document.getElementById("undo").disabled = historyIndex <= 0;
    document.getElementById("redo").disabled = historyIndex >= history.length - 1;
}

resetCanvas();
saveState();

// --------------------
// ВЫБОР ИНСТРУМЕНТА
// --------------------

document.querySelectorAll(".tool").forEach(button => {
    button.addEventListener("click", function() {
        document.querySelectorAll(".tool").forEach(b => b.classList.remove("active"));

        this.classList.add("active");
        tool = this.dataset.tool;

        document.getElementById("toolInfo").textContent = toolNames[tool];
        canvas.style.cursor = tool === "picker" ? "copy" : "crosshair";
    });
});

// --------------------
// НАСТРОЙКИ
// --------------------

sizeInput.addEventListener("input", function() {
    sizeValue.textContent = this.value + " px";
});

opacityInput.addEventListener("input", function() {
    opacityValue.textContent = this.value + "%";
});

document.querySelectorAll(".swatch").forEach(button => {
    button.addEventListener("click", function() {
        colorInput.value = this.dataset.color;
    });
});

// --------------------
// КООРДИНАТЫ
// --------------------

function getPosition(event) {
    const rect = canvas.getBoundingClientRect();

    return {
        x: Math.max(0, Math.min(canvas.width,
            (event.clientX - rect.left) * canvas.width / rect.width)),
        y: Math.max(0, Math.min(canvas.height,
            (event.clientY - rect.top) * canvas.height / rect.height))
    };
}

// --------------------
// ОБЩИЕ НАСТРОЙКИ КИСТИ
// --------------------

function applyStyle() {
    ctx.lineWidth = Number(sizeInput.value);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = colorInput.value;
    ctx.fillStyle = colorInput.value;
    ctx.globalAlpha = Number(opacityInput.value) / 100;
}

// --------------------
// НАЧАЛО РИСОВАНИЯ
// --------------------

function startDrawing(event) {
    if (event.button !== undefined && event.button !== 0) return;

    event.preventDefault();

    const pos = getPosition(event);

    startX = pos.x;
    startY = pos.y;
    lastX = pos.x;
    lastY = pos.y;

    if (tool === "picker") {
        const pixel = ctx.getImageData(
            Math.floor(pos.x), Math.floor(pos.y), 1, 1
        ).data;

        colorInput.value = rgbToHex(pixel[0], pixel[1], pixel[2]);
        return;
    }

    if (tool === "fill") {
        floodFill(Math.floor(pos.x), Math.floor(pos.y));
        saveState();
        return;
    }

    if (tool === "text") {
        const value = prompt("Введите текст:");
        if (value !== null && value.trim() !== "") {
            applyStyle();
            ctx.font = "bold " + document.getElementById("fontSize").value + "px Arial";
            ctx.textBaseline = "top";
            ctx.fillText(value, pos.x, pos.y);
            ctx.globalAlpha = 1;
            saveState();
        }
        return;
    }

    drawing = true;

    if (["line", "rectangle", "circle", "triangle", "star", "diamond", "gradient"].includes(tool)) {
        previewImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
    } else {
        applyStyle();

        if (tool === "eraser") {
            ctx.globalCompositeOperation = "destination-out";
        }

        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.lineTo(pos.x + 0.1, pos.y + 0.1);
        ctx.stroke();
        if (document.getElementById("symmetry").checked) {
            ctx.save();
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            ctx.lineTo(pos.x + 0.1, pos.y + 0.1);
            ctx.stroke();
            ctx.restore();
        }

        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
    }

    try {
        canvas.setPointerCapture(event.pointerId);
    } catch(e) {}
}

// --------------------
// ДВИЖЕНИЕ
// --------------------

function draw(event) {
    if (!drawing) return;

    event.preventDefault();

    const pos = getPosition(event);

    if (["line", "rectangle", "circle", "triangle", "star", "diamond", "gradient"].includes(tool)) {
        ctx.putImageData(previewImage, 0, 0);
        drawShape(startX, startY, pos.x, pos.y);
        return;
    }

    applyStyle();

    if (tool === "eraser") {
        ctx.globalCompositeOperation = "destination-out";
    }

    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    if (document.getElementById("symmetry").checked) {
        ctx.save();
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        ctx.restore();
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    lastX = pos.x;
    lastY = pos.y;
}

// --------------------
// ФИГУРЫ
// --------------------

function drawShape(x1, y1, x2, y2, mirrored = false) {
    applyStyle();

    const mode = document.getElementById("shapeMode").value;

    ctx.beginPath();

    if (tool === "line") {
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    }

    if (tool === "rectangle") {
        const x = Math.min(x1, x2);
        const y = Math.min(y1, y2);
        const w = Math.abs(x2 - x1);
        const h = Math.abs(y2 - y1);

        if (mode === "fill") {
            ctx.fillRect(x, y, w, h);
        } else {
            ctx.strokeRect(x, y, w, h);
        }
    }

    if (tool === "circle") {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const radius = Math.sqrt(dx * dx + dy * dy);

        ctx.arc(x1, y1, radius, 0, Math.PI * 2);

        if (mode === "fill") ctx.fill();
        else ctx.stroke();
    }

    if (tool === "triangle") {
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineTo(x1 - (x2 - x1), y2);
        ctx.closePath();

        if (mode === "fill") ctx.fill();
        else ctx.stroke();
    }

    if (tool === "diamond") {
        const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
        ctx.moveTo(cx, y1); ctx.lineTo(x2, cy);
        ctx.lineTo(cx, y2); ctx.lineTo(x1, cy); ctx.closePath();
        if (mode === "fill") ctx.fill(); else ctx.stroke();
    }

    if (tool === "star") {
        const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
        const outer = Math.max(2, Math.hypot(x2-x1, y2-y1)/2);
        const inner = outer * 0.42;
        for (let i = 0; i < 10; i++) {
            const radius = i % 2 === 0 ? outer : inner;
            const angle = -Math.PI/2 + i*Math.PI/5;
            const px = cx + Math.cos(angle)*radius;
            const py = cy + Math.sin(angle)*radius;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        if (mode === "fill") ctx.fill(); else ctx.stroke();
    }

    if (tool === "gradient") {
        const gradient = ctx.createLinearGradient(x1, y1, x2, y2);
        gradient.addColorStop(0, colorInput.value);
        gradient.addColorStop(1, "#ffffff");
        ctx.fillStyle = gradient;
        ctx.globalAlpha = Number(opacityInput.value) / 100;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    if (!mirrored && tool !== "gradient" && document.getElementById("symmetry").checked) {
        ctx.save();
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        drawShape(x1, y1, x2, y2, true);
        ctx.restore();
    }

    ctx.globalAlpha = 1;
}

// --------------------
// ЗАВЕРШЕНИЕ
// --------------------

function stopDrawing(event) {
    if (!drawing) return;

    const pos = event ? getPosition(event) : {x:lastX, y:lastY};

    if (["line", "rectangle", "circle", "triangle", "star", "diamond", "gradient"].includes(tool)) {
        ctx.putImageData(previewImage, 0, 0);
        drawShape(startX, startY, pos.x, pos.y);
    }

    drawing = false;
    previewImage = null;

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    saveState();
}

// --------------------
// ЗАЛИВКА
// --------------------

function floodFill(startX, startY) {
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;

    const width = canvas.width;
    const height = canvas.height;

    const start = (startY * width + startX) * 4;

    const oldR = data[start];
    const oldG = data[start + 1];
    const oldB = data[start + 2];
    const oldA = data[start + 3];

    const color = hexToRgb(colorInput.value);
    const alpha = Number(opacityInput.value) / 100;

    if (
        Math.abs(oldR - color.r) < 2 &&
        Math.abs(oldG - color.g) < 2 &&
        Math.abs(oldB - color.b) < 2 &&
        oldA === 255 && alpha === 1
    ) return;

    const stack = [[startX, startY]];
    const visited = new Uint8Array(width * height);
    const tolerance = 24;

    while (stack.length) {
        const point = stack.pop();
        const x = point[0];
        const y = point[1];

        if (x < 0 || x >= width || y < 0 || y >= height) continue;

        const pixel = y * width + x;
        if (visited[pixel]) continue;

        visited[pixel] = 1;

        const i = pixel * 4;

        if (
            Math.abs(data[i] - oldR) > tolerance ||
            Math.abs(data[i + 1] - oldG) > tolerance ||
            Math.abs(data[i + 2] - oldB) > tolerance ||
            Math.abs(data[i + 3] - oldA) > tolerance
        ) continue;

        data[i] = color.r * alpha + data[i] * (1 - alpha);
        data[i + 1] = color.g * alpha + data[i + 1] * (1 - alpha);
        data[i + 2] = color.b * alpha + data[i + 2] * (1 - alpha);
        data[i + 3] = 255;

        stack.push(
            [x + 1, y],
            [x - 1, y],
            [x, y + 1],
            [x, y - 1]
        );
    }

    ctx.putImageData(imageData, 0, 0);
}

// --------------------
// ЦВЕТА
// --------------------

function rgbToHex(r, g, b) {
    return "#" + [r, g, b].map(v =>
        Math.round(v).toString(16).padStart(2, "0")
    ).join("");
}

function hexToRgb(hex) {
    return {
        r: parseInt(hex.slice(1, 3), 16),
        g: parseInt(hex.slice(3, 5), 16),
        b: parseInt(hex.slice(5, 7), 16)
    };
}

// --------------------
// POINTER EVENTS
// --------------------

canvas.addEventListener("pointerdown", startDrawing);
canvas.addEventListener("pointermove", draw);
canvas.addEventListener("pointerup", stopDrawing);
canvas.addEventListener("pointercancel", stopDrawing);
canvas.addEventListener("lostpointercapture", function() {
    if (drawing) stopDrawing(null);
});

// --------------------
// UNDO / REDO
// --------------------

document.getElementById("undo").addEventListener("click", function() {
    if (historyIndex > 0) {
        historyIndex--;
        restoreState(historyIndex);
        updateHistoryButtons();
    }
});

document.getElementById("redo").addEventListener("click", function() {
    if (historyIndex < history.length - 1) {
        historyIndex++;
        restoreState(historyIndex);
        updateHistoryButtons();
    }
});

// --------------------
// ОЧИСТКА
// --------------------

document.getElementById("clear").addEventListener("click", function() {
    if (confirm("Очистить весь рисунок?")) {
        resetCanvas();
        saveState();
    }
});

document.getElementById("newCanvas").addEventListener("click", function() {
    if (!confirm("Создать новый чистый холст?")) return;

    resetCanvas();
    history = [];
    historyIndex = -1;
    saveState();
});

// --------------------
// НОВЫЕ ФУНКЦИИ
// --------------------

document.getElementById("toggleGrid").addEventListener("click", function() {
    const frame = document.querySelector(".canvas-frame");
    frame.classList.toggle("grid-on");
    this.classList.toggle("active", frame.classList.contains("grid-on"));
});

document.getElementById("flipHorizontal").addEventListener("click", function() {
    const temp = document.createElement("canvas");
    temp.width = canvas.width; temp.height = canvas.height;
    temp.getContext("2d").drawImage(canvas, 0, 0);
    ctx.save(); ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
    ctx.drawImage(temp, 0, 0); ctx.restore(); saveState();
});

document.getElementById("flipVertical").addEventListener("click", function() {
    const temp = document.createElement("canvas");
    temp.width = canvas.width; temp.height = canvas.height;
    temp.getContext("2d").drawImage(canvas, 0, 0);
    ctx.save(); ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.translate(0, canvas.height); ctx.scale(1, -1);
    ctx.drawImage(temp, 0, 0); ctx.restore(); saveState();
});

document.getElementById("rotateCanvas").addEventListener("click", function() {
    const temp = document.createElement("canvas");
    temp.width = canvas.width; temp.height = canvas.height;
    temp.getContext("2d").drawImage(canvas, 0, 0);
    ctx.save(); ctx.clearRect(0, 0, canvas.width, canvas.height);
    const scale = Math.min(canvas.width / temp.height, canvas.height / temp.width);
    const rotatedWidth = temp.height * scale;
    const rotatedHeight = temp.width * scale;
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(Math.PI / 2);
    ctx.drawImage(temp, -rotatedWidth / 2, -rotatedHeight / 2, rotatedWidth, rotatedHeight);
    ctx.restore(); saveState();
});

function applyFilter(type) {
    const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = image.data;
    for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i + 1], b = data[i + 2];
        if (type === "gray") {
            const v = 0.299 * r + 0.587 * g + 0.114 * b;
            data[i] = data[i + 1] = data[i + 2] = v;
        } else if (type === "sepia") {
            data[i] = Math.min(255, 0.393*r + 0.769*g + 0.189*b);
            data[i + 1] = Math.min(255, 0.349*r + 0.686*g + 0.168*b);
            data[i + 2] = Math.min(255, 0.272*r + 0.534*g + 0.131*b);
        } else if (type === "invert") {
            data[i] = 255-r;
            data[i + 1] = 255-g;
            data[i + 2] = 255-b;
        }
    }
    ctx.putImageData(image, 0, 0);
    saveState();
}

document.getElementById("filterGray").addEventListener("click", () => applyFilter("gray"));
document.getElementById("filterSepia").addEventListener("click", () => applyFilter("sepia"));
document.getElementById("filterInvert").addEventListener("click", () => applyFilter("invert"));

// --------------------
// МАСШТАБ
// --------------------

function setZoom(value) {
    zoom = Math.max(0.25, Math.min(2, value));

    canvas.style.width = (canvas.width * zoom) + "px";
    canvas.style.height = (canvas.height * zoom) + "px";

    document.getElementById("zoomLabel").textContent =
        Math.round(zoom * 100) + "%";
}

document.getElementById("zoomIn").addEventListener("click", () => setZoom(zoom + 0.1));
document.getElementById("zoomOut").addEventListener("click", () => setZoom(zoom - 0.1));
document.getElementById("zoomReset").addEventListener("click", () => setZoom(1));
document.getElementById("zoomLabel").addEventListener("click", () => setZoom(1));

// --------------------
// ОТКРЫТИЕ ИЗОБРАЖЕНИЯ
// --------------------

const imageFile = document.getElementById("imageFile");

document.getElementById("openImage").addEventListener("click", function() {
    imageFile.click();
});

imageFile.addEventListener("change", function() {
    const file = this.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {
        const image = new Image();

        image.onload = function() {
            resetCanvas();

            const scale = Math.min(
                canvas.width / image.width,
                canvas.height / image.height
            );

            const w = image.width * scale;
            const h = image.height * scale;

            ctx.drawImage(
                image,
                (canvas.width - w) / 2,
                (canvas.height - h) / 2,
                w,
                h
            );

            saveState();
        };

        image.src = e.target.result;
    };

    reader.readAsDataURL(file);
    this.value = "";
});

// --------------------
// СОХРАНЕНИЕ
// --------------------

function downloadImage(type) {
    let link = document.createElement("a");

    if (type === "png") {
        link.download = "pixel_paint.png";
        link.href = canvas.toDataURL("image/png");
    } else {
        const temp = document.createElement("canvas");
        temp.width = canvas.width;
        temp.height = canvas.height;

        const tempCtx = temp.getContext("2d");
        tempCtx.fillStyle = "#ffffff";
        tempCtx.fillRect(0, 0, temp.width, temp.height);
        tempCtx.drawImage(canvas, 0, 0);

        link.download = "pixel_paint.jpg";
        link.href = temp.toDataURL("image/jpeg", 0.95);
    }

    link.click();
}

document.getElementById("savePNG").addEventListener("click", () => downloadImage("png"));

const jpgButton = document.createElement("button");
jpgButton.textContent = "JPG";
jpgButton.addEventListener("click", () => downloadImage("jpg"));
document.querySelector(".header-right").appendChild(jpgButton);

// --------------------
// ГОРЯЧИЕ КЛАВИШИ
// --------------------

document.addEventListener("keydown", function(event) {
    const key = event.key.toLowerCase();

    if (event.ctrlKey && key === "z") {
        event.preventDefault();
        document.getElementById("undo").click();
    }

    if (event.ctrlKey && key === "y") {
        event.preventDefault();
        document.getElementById("redo").click();
    }

    if (event.ctrlKey && key === "s") {
        event.preventDefault();
        downloadImage("png");
    }

    if (event.key === "Escape" && drawing) {
        drawing = false;
        previewImage = null;
        restoreState(historyIndex);
    }
});

setZoom(1);
</script>
