<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIXEL Документы</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b17;color:#f5f2ff;font:14px Arial}.top{padding:15px 22px;display:flex;justify-content:space-between;background:#111326;border-bottom:1px solid #34304f}.top a{color:#c8b9ff;text-decoration:none}.app{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 54px)}aside{padding:15px;background:#101123;border-right:1px solid #34304f}.main{padding:18px;min-width:0}.btn{background:#282343;color:white;border:1px solid #514477;border-radius:8px;padding:9px 11px;cursor:pointer}.list{margin-top:14px;display:flex;flex-direction:column;gap:5px}.list button{display:block;width:100%;text-align:left;background:transparent;color:#ddd;border:0;padding:10px;border-radius:8px;cursor:pointer;overflow:hidden;text-overflow:ellipsis}.list button.active{background:#292344}.toolbar{display:flex;gap:5px;flex-wrap:wrap;background:#17182c;padding:10px;border-radius:12px 12px 0 0}.toolbar select,.toolbar button,.toolbar input{background:#282343;color:#fff;border:1px solid #514477;border-radius:6px;padding:7px;min-height:34px}.toolbar input[type=color]{width:38px;padding:2px}.title{width:100%;padding:12px;background:#17182c;color:white;border:1px solid #383653;font-size:18px}.paper{min-height:68vh;background:#fff;color:#20202b;padding:38px;outline:none;line-height:1.65;font:16px Arial;box-shadow:0 8px 30px #0005;overflow-wrap:anywhere}.paper:focus{outline:2px solid #8064d2}.status{color:#aaa8c4;font-size:12px;margin:8px 0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.hint{color:#aaa8c4;line-height:1.5;font-size:12px}.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}@media(max-width:760px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #34304f}.list{display:flex;overflow:auto}.list button{min-width:125px}.paper{padding:18px;min-height:60vh}.main{padding:9px}.top{padding:12px}}
@media print{body{background:white}.top,aside,.toolbar,.title,.status{display:none!important}.app{display:block}.main{padding:0}.paper{box-shadow:none;min-height:0;padding:0;color:#000}}
</style></head><body><header class="top"><b>PIXEL / ДОКУМЕНТЫ</b><a href="/">← В каталог</a></header>
<div class="app"><aside><button class="btn" id="new">＋ Новый документ</button><div class="side-actions"><button class="btn" id="duplicate">Дублировать</button><button class="btn" id="remove">Удалить</button><button class="btn" id="save">Сохранить</button><button class="btn" id="downloadHtml">Скачать HTML</button><button class="btn" id="downloadTxt">Скачать TXT</button><button class="btn" id="print">Печать / PDF</button><button class="btn" id="import">Импорт файла</button></div><input id="file" type="file" accept=".txt,.html,.htm,text/plain,text/html" hidden><div class="list" id="list"></div><p class="hint">Документы сохраняются в памяти этого браузера на устройстве. Для переноса скачай файл. Синхронизация между устройствами пока не подключена.</p></aside>
<main class="main"><input class="title" id="title" placeholder="Название документа"><div class="toolbar">
<button data-cmd="undo">↶</button><button data-cmd="redo">↷</button><button data-cmd="bold"><b>Ж</b></button><button data-cmd="italic"><i>К</i></button><button data-cmd="underline"><u>Ч</u></button><button data-cmd="strikeThrough"><s>А</s></button>
<select id="size"><option value="3">Обычный</option><option value="5">Заголовок</option><option value="4">Подзаголовок</option><option value="2">Мелкий</option></select>
<select id="font"><option>Arial</option><option>Georgia</option><option>Times New Roman</option><option>Verdana</option><option>Courier New</option></select>
<label title="Цвет текста"><input type="color" id="textColor" value="#20202b"></label><label title="Выделение"><input type="color" id="highlight" value="#fff09a"></label>
<button data-cmd="insertUnorderedList">• Список</button><button data-cmd="insertOrderedList">1. Список</button><button data-cmd="justifyLeft">←</button><button data-cmd="justifyCenter">↔</button><button data-cmd="justifyRight">→</button><button data-cmd="justifyFull">☰</button><button id="link">🔗 Ссылка</button><button id="table">▦ Таблица</button><button id="rule">Линия</button><button id="clear">Очистить формат</button>
</div><div id="paper" class="paper" contenteditable="true" spellcheck="true"><h1>Мой документ</h1><p>Начни писать здесь...</p></div><div class="status"><span id="saveStatus">Готово</span><span id="stats">0 слов · 0 символов</span></div></main></div>
<script>
(function(){
const key='pixelDocsV2',title=document.getElementById('title'),paper=document.getElementById('paper'),list=document.getElementById('list'),status=document.getElementById('saveStatus'),stats=document.getElementById('stats');let docs=[],active=null,saveTimer=null;
try{docs=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(docs))docs=[]}catch(e){docs=[]}
function current(){return docs.find(d=>d.id===active)}
function persist(){try{localStorage.setItem(key,JSON.stringify(docs));status.textContent='Сохранено · '+new Date().toLocaleTimeString()}catch(e){status.textContent='Память браузера заполнена — скачай документ'}}
function updateStats(){let t=paper.innerText||'',words=t.trim()?t.trim().split(/\s+/).length:0;stats.textContent=words+' слов · '+t.length+' символов'}
function snapshot(){let d=current();if(!d)return;d.title=title.value.trim()||'Без названия';d.html=paper.innerHTML;d.updated=Date.now();persist();renderList();updateStats()}
function schedule(){clearTimeout(saveTimer);saveTimer=setTimeout(snapshot,450)}
function renderList(){list.innerHTML='';docs.forEach(d=>{let b=document.createElement('button');b.textContent=d.title||'Без названия';b.title=b.textContent;b.className=d.id===active?'active':'';b.onclick=()=>open(d.id);list.appendChild(b)})}
function open(id){if(current())snapshot();active=id;let d=current();if(!d)return;title.value=d.title;paper.innerHTML=d.html;renderList();updateStats();status.textContent='Открыт документ'}
function create(name,content){if(current())snapshot();let id=String(Date.now())+Math.random().toString(16).slice(2,6);docs.unshift({id,title:name||'Новый документ',html:content||'<h1>Новый документ</h1><p>Начни писать здесь...</p>',updated:Date.now()});open(id);snapshot();paper.focus()}
document.getElementById('new').onclick=()=>create();
document.getElementById('save').onclick=snapshot;
document.getElementById('duplicate').onclick=()=>{let d=current();if(d)create((d.title||'Документ')+' — копия',d.html)};
document.getElementById('remove').onclick=()=>{if(!current()||!confirm('Удалить этот документ?'))return;docs=docs.filter(d=>d.id!==active);active=null;if(docs.length)open(docs[0].id);else create();persist()};
title.oninput=()=>{let d=current();if(d)d.title=title.value;renderList();schedule()};
paper.oninput=()=>{let d=current();if(d){d.html=paper.innerHTML;d.updated=Date.now()}updateStats();schedule()};
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{paper.focus();document.execCommand(b.dataset.cmd,false,null);schedule()});
document.getElementById('size').onchange=e=>{paper.focus();document.execCommand('formatBlock',false,e.target.value==='5'?'h1':e.target.value==='4'?'h2':e.target.value==='2'?'small':'p');schedule()};
document.getElementById('font').onchange=e=>{paper.focus();document.execCommand('fontName',false,e.target.value);schedule()};
document.getElementById('textColor').oninput=e=>{paper.focus();document.execCommand('foreColor',false,e.target.value);schedule()};
document.getElementById('highlight').oninput=e=>{paper.focus();document.execCommand('hiliteColor',false,e.target.value);schedule()};
document.getElementById('table').onclick=()=>{paper.focus();document.execCommand('insertHTML',false,'<table border="1" style="border-collapse:collapse;width:100%"><tr><td>Ячейка</td><td>Ячейка</td></tr><tr><td>Ячейка</td><td>Ячейка</td></tr></table><p></p>');schedule()};
document.getElementById('rule').onclick=()=>{paper.focus();document.execCommand('insertHTML',false,'<hr><p></p>');schedule()};
document.getElementById('link').onclick=()=>{let u=prompt('Адрес ссылки (https://...)');if(u){paper.focus();document.execCommand('createLink',false,u);schedule()}};
document.getElementById('clear').onclick=()=>{paper.focus();document.execCommand('removeFormat');schedule()};
function download(name,type,data){let blob=new Blob([data],{type}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.getElementById('downloadHtml').onclick=()=>{snapshot();let d=current();if(d)download((d.title||'document')+'.html','text/html;charset=utf-8','<!doctype html><meta charset="utf-8"><title>'+d.title+'</title>'+d.html)};
document.getElementById('downloadTxt').onclick=()=>{snapshot();let d=current();if(d)download((d.title||'document')+'.txt','text/plain;charset=utf-8',paper.innerText)};
document.getElementById('print').onclick=()=>{snapshot();window.print()};
document.getElementById('import').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{let s=String(reader.result||''),content=f.name.toLowerCase().endsWith('.txt')?'<p>'+s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/\r?\n/g,'<br>')+'</p>':s.replace(/<script[\s\S]*?<\/script>/gi,'');create(f.name.replace(/\.(txt|html?)$/i,''),content)};reader.readAsText(f);e.target.value=''};
if(docs.length)open(docs[0].id);else create('Мой документ','<h1>Мой документ</h1><p>Начни писать здесь...</p>');
})();
</script></body></html>
