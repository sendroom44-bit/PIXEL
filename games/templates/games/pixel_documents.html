<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIXEL Документы</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0b17;color:#f5f2ff;font:14px Arial}.top{padding:15px 22px;display:flex;justify-content:space-between;background:#111326;border-bottom:1px solid #34304f}.top a{color:#c8b9ff;text-decoration:none}.app{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 54px)}aside{padding:16px;background:#101123;border-right:1px solid #34304f}.main{padding:18px;min-width:0}.btn{background:#282343;color:white;border:1px solid #514477;border-radius:9px;padding:9px 12px;cursor:pointer;margin:3px}.list button{display:block;width:100%;text-align:left;background:transparent;color:#ddd;border:0;padding:10px;border-radius:8px;cursor:pointer}.list button.active{background:#292344}.toolbar{display:flex;gap:5px;flex-wrap:wrap;background:#17182c;padding:10px;border-radius:12px 12px 0 0}.toolbar select,.toolbar button{background:#282343;color:#fff;border:1px solid #514477;border-radius:6px;padding:7px}.title{width:100%;padding:12px;background:#17182c;color:white;border:1px solid #383653;font-size:18px}.paper{min-height:65vh;background:#fff;color:#20202b;padding:30px;outline:none;line-height:1.6;font:16px Arial;box-shadow:0 8px 30px #0005}.paper:focus{outline:2px solid #8064d2}.status{color:#aaa8c4;font-size:12px;margin:8px 0}.list{margin-top:15px}@media(max-width:700px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #34304f}.list{display:flex;overflow:auto}.list button{min-width:120px}.paper{padding:16px;min-height:60vh}.main{padding:9px}}
</style></head><body><header class="top"><b>PIXEL / ДОКУМЕНТЫ</b><a href="/">← В каталог</a></header><div class="app"><aside><button class="btn" id="new">＋ Новый документ</button><button class="btn" id="save">Сохранить</button><button class="btn" id="download">Скачать .html</button><div class="list" id="list"></div><p style="color:#aaa8c4;line-height:1.5;font-size:12px">Документы автоматически сохраняются в этом браузере на устройстве. Для переноса используй скачивание.</p></aside><main class="main"><input class="title" id="title" placeholder="Название документа"><div class="toolbar"><button data-cmd="bold"><b>Ж</b></button><button data-cmd="italic"><i>К</i></button><button data-cmd="underline"><u>Ч</u></button><select id="size"><option value="3">Обычный</option><option value="5">Заголовок</option><option value="4">Подзаголовок</option><option value="2">Мелкий</option></select><button data-cmd="insertUnorderedList">• Список</button><button data-cmd="insertOrderedList">1. Список</button><button data-cmd="justifyLeft">←</button><button data-cmd="justifyCenter">↔</button><button data-cmd="justifyRight">→</button><button id="table">Таблица</button><button id="clear">Очистить формат</button></div><div id="paper" class="paper" contenteditable="true" spellcheck="true"><h1>Мой документ</h1><p>Начни писать здесь...</p></div><div class="status" id="status">Готово</div></main></div><script>
(function(){const key='pixelDocsV1';let docs=[];try{docs=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}let active=null;const title=document.getElementById('title'),paper=document.getElementById('paper'),list=document.getElementById('list');function persist(){localStorage.setItem(key,JSON.stringify(docs));document.getElementById('status').textContent='Сохранено · '+new Date().toLocaleTimeString()}function render(){list.innerHTML='';docs.forEach(d=>{let b=document.createElement('button');b.textContent=d.title||'Без названия';b.className=d.id===active?'active':'';b.onclick=()=>open(d.id);list.appendChild(b)})}function snapshot(){let d=docs.find(x=>x.id===active);if(!d)return;d.title=title.value;d.html=paper.innerHTML;d.updated=Date.now();persist();render()}function open(id){snapshot();active=id;let d=docs.find(x=>x.id===id);title.value=d.title;paper.innerHTML=d.html;render()}function create(){snapshot();active=String(Date.now());docs.unshift({id:active,title:'Новый документ',html:'<h1>Новый документ</h1><p>Начни писать здесь...</p>',updated:Date.now()});open(active);persist()}document.getElementById('new').onclick=create;document.getElementById('save').onclick=snapshot;title.oninput=()=>{let d=docs.find(x=>x.id===active);if(d)d.title=title.value;render();persist()};paper.oninput=()=>{let d=docs.find(x=>x.id===active);if(d){d.html=paper.innerHTML;d.updated=Date.now();persist()}};document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{paper.focus();document.execCommand(b.dataset.cmd,false,null)});document.getElementById('size').onchange=e=>{paper.focus();document.execCommand('fontSize',false,e.target.value)};document.getElementById('table').onclick=()=>{paper.focus();document.execCommand('insertHTML',false,'<table border="1" style="border-collapse:collapse;width:100%"><tr><td>Ячейка</td><td>Ячейка</td></tr><tr><td>Ячейка</td><td>Ячейка</td></tr></table><p></p>')};document.getElementById('clear').onclick=()=>{paper.focus();document.execCommand('removeFormat')};document.getElementById('download').onclick=()=>{snapshot();let d=docs.find(x=>x.id===active),blob=new Blob(['<!doctype html><meta charset="utf-8"><title>'+d.title+'</title>'+d.html],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(d.title||'document')+'.html';a.click();URL.revokeObjectURL(a.href)};if(docs.length)open(docs[0].id);else create()})();
</script></body></html>
