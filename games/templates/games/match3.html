
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PIXEL Match-3</title>

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #344779, transparent 48%), #10131e;
    color: #f5f6ff;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 17px 22px;
    border-bottom: 1px solid #ffffff16;
    background: #10131ed9;
}

.logo { font-size: 23px; font-weight: 900; letter-spacing: 2px; }
.logo span { color: #75aaff; }

.back {
    color: #b9c6e8;
    text-decoration: none;
    background: #ffffff0d;
    border: 1px solid #ffffff19;
    padding: 10px 15px;
    border-radius: 12px;
}

main { width: min(950px, 96%); margin: 25px auto; }

.heading { text-align: center; margin-bottom: 20px; }
.heading h1 { font-size: clamp(25px, 5vw, 38px); margin: 0 0 8px; }
.heading p { color: #9daacb; margin: 0; }

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 15px;
}

.stat {
    background: #1b2234;
    border: 1px solid #ffffff18;
    border-radius: 14px;
    padding: 12px 5px;
    text-align: center;
}

.stat small {
    display: block;
    color: #9ba9ca;
    font-size: 11px;
    margin-bottom: 6px;
    text-transform: uppercase;
}

.stat strong { font-size: 22px; }

.objective {
    background: #1b2234;
    border: 1px solid #ffffff18;
    border-radius: 15px;
    padding: 14px 17px;
    margin-bottom: 17px;
}

.objective-line {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 14px;
    margin-bottom: 10px;
}

.progress {
    height: 9px;
    background: #0d1220;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #559bff, #bd75ff);
    border-radius: 20px;
    transition: width .25s;
}

.game-area {
    background: linear-gradient(145deg, #263653, #151c2e);
    border: 1px solid #ffffff25;
    padding: clamp(7px, 2vw, 15px);
    border-radius: 20px;
    box-shadow: 0 18px 55px #0006;
}

.board {
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    gap: 5px;
    width: 100%;
    aspect-ratio: 1;
    touch-action: manipulation;
}

.tile {
    border: 2px solid #ffffff28;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-width: 0;
    min-height: 0;
    padding: 0;
    font-size: clamp(18px, 5.5vw, 42px);
    cursor: pointer;
    position: relative;
    transition: transform .13s, opacity .2s, filter .13s;
    user-select: none;
    box-shadow: inset 0 3px 7px #ffffff35, 0 4px 5px #0005;
    text-shadow: 0 2px 4px #0008;
}

.tile.p0 { background: linear-gradient(145deg, #7e9cff, #344eaa); }
.tile.p1 { background: linear-gradient(145deg, #c5a1ff, #7042bd); }
.tile.p2 { background: linear-gradient(145deg, #ffb16f, #b65c28); }
.tile.p3 { background: linear-gradient(145deg, #ff8ca8, #ad355e); }
.tile.p4 { background: linear-gradient(145deg, #79e2c5, #218e78); }
.tile.p5 { background: linear-gradient(145deg, #8bdcff, #277cba); }
.tile.p6 { background: linear-gradient(145deg, #ffdc75, #bd8521); }
.tile.p7 { background: linear-gradient(145deg, #a7e98b, #4d9a40); }

.tile:active { transform: scale(.91); }

.tile.selected {
    border: 3px solid white;
    transform: scale(.91);
    filter: brightness(1.3);
    box-shadow: 0 0 18px #ffffffaa, inset 0 2px 8px #ffffff66;
    z-index: 2;
}

.tile.hint {
    animation: hintPulse .55s ease-in-out infinite alternate;
    border: 3px solid #fff;
    z-index: 3;
}

@keyframes hintPulse {
    from { transform: scale(1); filter: brightness(1); }
    to { transform: scale(.88); filter: brightness(1.6); }
}

.tile.empty { opacity: 0; pointer-events: none; }

.tile.balloon-rise {
    animation: balloonRise .7s ease-in forwards;
    z-index: 5;
}

@keyframes balloonRise {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-130px) scale(.4); opacity: 0; }
}

.tile.falling { animation: fallIn .24s ease-out; }

@keyframes fallIn {
    from { transform: translateY(-45px); opacity: .2; }
    to { transform: translateY(0); opacity: 1; }
}

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
}

.btn {
    border: 0;
    padding: 13px 19px;
    border-radius: 12px;
    color: white;
    background: linear-gradient(135deg, #548fff, #6959db);
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
}

.btn.secondary { background: #303f5d; }
.btn:active { transform: scale(.96); }

.message {
    text-align: center;
    min-height: 24px;
    color: #b8c8e9;
    font-size: 14px;
    margin-top: 14px;
}

.rules {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
    margin-top: 18px;
}

.rule {
    background: #1b2234;
    border: 1px solid #ffffff18;
    border-radius: 12px;
    padding: 10px 5px;
    text-align: center;
    color: #c5d0ea;
    font-size: 12px;
}

.rule span { display: block; font-size: 25px; margin-bottom: 5px; }

.overlay {
    position: fixed;
    inset: 0;
    background: #080c16dd;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 20;
}

.overlay.show { display: flex; }

.popup {
    width: min(360px, 100%);
    background: #202b43;
    border: 1px solid #ffffff25;
    border-radius: 20px;
    padding: 28px;
    text-align: center;
    box-shadow: 0 20px 70px #0009;
}

.popup h2 { margin-top: 0; font-size: 27px; }
.popup p { color: #b7c4e2; line-height: 1.5; }

@media(max-width: 500px) {
    main { margin: 16px auto; }
    .top { padding: 13px; }
    .stats { gap: 6px; }
    .stat { padding: 10px 3px; }
    .stat strong { font-size: 18px; }
    .stat small { font-size: 9px; }
    .board { gap: 3px; }
    .tile { border-radius: 6px; }
    .rules { gap: 5px; }
    .rule { font-size: 10px; }
}
</style>
</head>

<body>

<header class="top">
    <div class="logo">PIXEL <span>GAMES</span></div>
    <a href="/" class="back">← На главную</a>
</header>

<main>
    <div class="heading">
        <h1>PIXEL Match-3</h1>
        <p>Собирай комбинации и проходи уровни!</p>
    </div>

    <div class="stats">
        <div class="stat"><small>Уровень</small><strong id="level">1</strong></div>
        <div class="stat"><small>Очки</small><strong id="score">0</strong></div>
        <div class="stat"><small>Ходы</small><strong id="moves">25</strong></div>
        <div class="stat"><small>Цель</small><strong id="target">500</strong></div>
    </div>

    <div class="objective">
        <div class="objective-line">
            <span id="objectiveText">Набери 500 очков</span>
            <strong id="progressText">0 / 500</strong>
        </div>
        <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="game-area">
        <div class="board" id="board"></div>
    </div>

    <div class="controls">
        <button class="btn secondary" id="restart">↻ Заново</button>
        <button class="btn secondary" id="hint">💡 Подсказка</button>
        <button class="btn" id="newLevel">Следующий уровень →</button>
    </div>

    <div class="message" id="message">Выбери элемент, затем соседний с ним.</div>

    <div class="rules">
        <div class="rule"><span>♟️</span>Шахматы</div>
        <div class="rule"><span>☕</span>Кружки</div>
        <div class="rule"><span>🚗</span>Машинки</div>
        <div class="rule"><span>🎈</span>Шарики</div>
    </div>
</main>

<div class="overlay" id="overlay">
    <div class="popup">
        <h2 id="popupTitle">Уровень пройден!</h2>
        <p id="popupText"></p>
        <button class="btn" id="popupButton">Продолжить</button>
    </div>
</div>

<script>
(function() {
"use strict";

const SIZE = 8;

const pieces = [
    {icon:"♟", name:"Пешка"},
    {icon:"♜", name:"Ладья"},
    {icon:"☕", name:"Кофе"},
    {icon:"🥤", name:"Стакан"},
    {icon:"🚗", name:"Машинка"},
    {icon:"🚕", name:"Такси"},
    {icon:"🎈", name:"Розовый шарик"},
    {icon:"🎈", name:"Зелёный шарик"}
];

const boardElement = document.getElementById("board");
const messageElement = document.getElementById("message");
const overlay = document.getElementById("overlay");

let board = [];
let selected = null;
let busy = false;
let score = 0;
let moves = 25;
let level = 1;
let target = 500;
let gameOver = false;
let hintTimer = null;

const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

function randomPiece() {
    return Math.floor(Math.random() * pieces.length);
}

function hasMatchAt(row, col, value, grid) {
    if (col >= 2 &&
        grid[row][col-1] === value &&
        grid[row][col-2] === value) return true;

    if (row >= 2 &&
        grid[row-1][col] === value &&
        grid[row-2][col] === value) return true;

    return false;
}

function createBoard() {
    board = [];

    for (let r = 0; r < SIZE; r++) {
        board[r] = [];

        for (let c = 0; c < SIZE; c++) {
            let value;

            do {
                value = randomPiece();
            } while (hasMatchAt(r, c, value, board));

            board[r][c] = value;
        }
    }

    // Если нет доступных ходов, генерируем поле заново
    let attempts = 0;
    while (!findPossibleMove() && attempts < 500) {
        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                board[r][c] = randomPiece();
            }
        }

        // Убираем готовые комбинации
        let matches = getMatches();
        while (matches.length) {
            matches.forEach(p => board[p.r][p.c] = randomPiece());
            matches = getMatches();
        }

        attempts++;
    }
}

function render() {
    boardElement.innerHTML = "";

    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            const value = board[r][c];
            const tile = document.createElement("button");

            tile.type = "button";
            tile.className = "tile";
            tile.dataset.row = r;
            tile.dataset.col = c;

            if (value !== null && value !== undefined) {
                tile.textContent = pieces[value].icon;
                tile.classList.add("p" + value);
                tile.title = pieces[value].name;
            } else {
                tile.classList.add("empty");
            }

            if (selected && selected.r === r && selected.c === c) {
                tile.classList.add("selected");
            }

            tile.addEventListener("click", () => selectTile(r, c));
            boardElement.appendChild(tile);
        }
    }

    updateStats();
}

function updateStats() {
    document.getElementById("level").textContent = level;
    document.getElementById("score").textContent = score;
    document.getElementById("moves").textContent = moves;
    document.getElementById("target").textContent = target;

    document.getElementById("progressText").textContent =
        Math.min(score, target) + " / " + target;

    document.getElementById("progressFill").style.width =
        Math.min(100, score / target * 100) + "%";

    document.getElementById("objectiveText").textContent =
        "Набери " + target + " очков";
}

function getMatches() {
    const found = new Set();

    // Горизонтальные линии
    for (let r = 0; r < SIZE; r++) {
        let c = 0;

        while (c < SIZE) {
            const value = board[r][c];
            let end = c + 1;

            while (value !== null && end < SIZE && board[r][end] === value) {
                end++;
            }

            if (value !== null && end - c >= 3) {
                for (let x = c; x < end; x++) found.add(r + "," + x);
            }

            c = end;
        }
    }

    // Вертикальные линии
    for (let c = 0; c < SIZE; c++) {
        let r = 0;

        while (r < SIZE) {
            const value = board[r][c];
            let end = r + 1;

            while (value !== null && end < SIZE && board[end][c] === value) {
                end++;
            }

            if (value !== null && end - r >= 3) {
                for (let x = r; x < end; x++) found.add(x + "," + c);
            }

            r = end;
        }
    }

    return Array.from(found).map(item => {
        const p = item.split(",");
        return {r:Number(p[0]), c:Number(p[1])};
    });
}

function adjacent(a, b) {
    return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
}

function swap(a, b) {
    const temp = board[a.r][a.c];
    board[a.r][a.c] = board[b.r][b.c];
    board[b.r][b.c] = temp;
}

// Ищем любой обмен, который создаёт комбинацию
function findPossibleMove() {
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            const a = {r:r, c:c};

            const neighbors = [
                {r:r, c:c+1},
                {r:r+1, c:c}
            ];

            for (const b of neighbors) {
                if (b.r >= SIZE || b.c >= SIZE) continue;

                swap(a, b);
                const valid = getMatches().length > 0;
                swap(a, b);

                if (valid) return {a:a, b:b};
            }
        }
    }

    return null;
}

async function selectTile(r, c) {
    if (busy || gameOver) return;

    clearHint();

    const current = {r:r, c:c};

    if (!selected) {
        selected = current;
        render();
        return;
    }

    if (selected.r === r && selected.c === c) {
        selected = null;
        render();
        return;
    }

    if (!adjacent(selected, current)) {
        selected = current;
        render();
        return;
    }

    const first = selected;
    selected = null;
    busy = true;

    swap(first, current);
    render();

    await delay(120);

    const matches = getMatches();

    if (matches.length === 0) {
        swap(first, current);
        render();
        messageElement.textContent = "Нет совпадения! Попробуй другую пару.";
        busy = false;
        return;
    }

    moves--;
    await processMatches(matches);

    busy = false;

    if (score >= target) {
        finishLevel(true);
    } else if (moves <= 0) {
        finishLevel(false);
    } else if (!findPossibleMove()) {
        shuffleBoard();
    }
}

async function processMatches(matches) {
    let combo = 0;

    while (matches.length > 0) {
        combo++;

        const points = matches.length * 10 * combo;
        score += points;

        messageElement.textContent =
            combo > 1
                ? "🔥 Комбо x" + combo + "! +" + points
                : "Отлично! +" + points + " очков";

        const tiles = boardElement.children;

        matches.forEach(pos => {
            const index = pos.r * SIZE + pos.c;
            const tile = tiles[index];
            const value = board[pos.r][pos.c];

            if (tile && value >= 6) {
                tile.classList.add("balloon-rise");
            } else if (tile) {
                tile.style.transform = "scale(0)";
                tile.style.opacity = "0";
            }
        });

        await delay(400);

        matches.forEach(pos => {
            board[pos.r][pos.c] = null;
        });

        // Падение элементов вниз
        for (let c = 0; c < SIZE; c++) {
            let write = SIZE - 1;

            for (let r = SIZE - 1; r >= 0; r--) {
                if (board[r][c] !== null) {
                    board[write][c] = board[r][c];

                    if (write !== r) board[r][c] = null;

                    write--;
                }
            }

            for (let r = write; r >= 0; r--) {
                board[r][c] = randomPiece();
            }
        }

        render();

        Array.from(boardElement.children).forEach(tile => {
            tile.classList.add("falling");
        });

        await delay(280);
        matches = getMatches();
    }

    updateStats();
}

function shuffleBoard() {
    const values = [];

    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) values.push(board[r][c]);
    }

    let attempts = 0;

    do {
        values.sort(() => Math.random() - 0.5);

        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                board[r][c] = values[r * SIZE + c];
            }
        }

        attempts++;
    } while ((getMatches().length || !findPossibleMove()) && attempts < 500);

    render();
    messageElement.textContent = "🔀 Поле перемешано! Ходы снова доступны.";
}

function showHint() {
    if (busy || gameOver) return;

    clearHint();

    const move = findPossibleMove();

    if (!move) {
        shuffleBoard();
        return;
    }

    const firstIndex = move.a.r * SIZE + move.a.c;
    const secondIndex = move.b.r * SIZE + move.b.c;

    boardElement.children[firstIndex].classList.add("hint");
    boardElement.children[secondIndex].classList.add("hint");

    messageElement.textContent = "💡 Попробуй поменять эти два элемента!";

    hintTimer = setTimeout(clearHint, 2500);
}

function clearHint() {
    if (hintTimer) clearTimeout(hintTimer);

    hintTimer = null;

    Array.from(boardElement.children).forEach(tile => {
        tile.classList.remove("hint");
    });
}

function finishLevel(won) {
    gameOver = true;

    document.getElementById("popupTitle").textContent =
        won ? "🎉 Уровень пройден!" : "Ходы закончились!";

    document.getElementById("popupText").textContent =
        won
            ? "Отличная работа! Ты набрал " + score + " очков."
            : "Нужно набрать " + target + " очков. Попробуй ещё раз!";

    document.getElementById("popupButton").textContent =
        won ? "Следующий уровень" : "Повторить";

    overlay.classList.add("show");
}

function startLevel(next) {
    if (next) level++;

    score = 0;
    moves = Math.max(18, 25 - Math.floor((level - 1) / 3));
    target = 500 + (level - 1) * 250;
    selected = null;
    busy = false;
    gameOver = false;

    clearHint();
    overlay.classList.remove("show");

    messageElement.textContent = "Собирай три одинаковых элемента!";

    createBoard();
    render();
}

document.getElementById("restart").addEventListener("click", () => {
    startLevel(false);
});

document.getElementById("newLevel").addEventListener("click", () => {
    if (!busy) startLevel(true);
});

document.getElementById("hint").addEventListener("click", showHint);

document.getElementById("popupButton").addEventListener("click", () => {
    if (score >= target) startLevel(true);
    else startLevel(false);
});

startLevel(false);

})();
</script>

</body>
</html>
