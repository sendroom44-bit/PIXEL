
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PIXEL Christmas Tower</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #080d1c;
    font-family: Arial, sans-serif;
    touch-action: none;
    overscroll-behavior: none;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
}

#interface {
    position: fixed;
    top: max(15px, env(safe-area-inset-top));
    left: 0;
    width: 100%;
    text-align: center;
    color: white;
    pointer-events: none;
    text-shadow: 0 2px 12px #020611;
    z-index: 5;
}

#title {
    font-size: clamp(15px, 4vw, 25px);
    font-weight: bold;
    letter-spacing: 2px;
    color: #e8fbff;
    text-shadow: 0 0 12px #3cc9ed, 0 2px 12px #020611;
}

#score {
    margin-top: 7px;
    font-size: 16px;
    color: #a9f1ff;
}

#help {
    position: fixed;
    bottom: 20px;
    width: 100%;
    text-align: center;
    color: #e2faff;
    font-size: 14px;
    pointer-events: none;
    text-shadow: 0 2px 8px #020611;
    z-index: 5;
}

#dropButton {
    display: none;
    position: fixed;
    z-index: 10;
    bottom: max(22px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    width: min(82%, 330px);
    min-height: 58px;
    border: 1px solid #9cf4ff;
    border-radius: 16px;
    background: linear-gradient(135deg, #12647b, #168e9e);
    color: white;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 1px;
    box-shadow: 0 0 22px #26c9e966;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

#dropButton:active {
    transform: translateX(-50%) scale(.96);
    background: #20a9b9;
}

#fullscreen {
    position: fixed;
    top: max(13px, env(safe-area-inset-top));
    right: 12px;
    z-index: 12;
    border: 1px solid #78cfe6;
    border-radius: 10px;
    background: #142c49cc;
    color: white;
    padding: 9px 12px;
    font-size: 19px;
    touch-action: manipulation;
}

#message {
    display: none;
    position: fixed;
    top: 42%;
    width: 100%;
    text-align: center;
    color: white;
    font-size: clamp(24px, 7vw, 34px);
    font-weight: bold;
    text-shadow: 0 3px 15px black;
    z-index: 15;
}

#restart {
    display: none;
    position: fixed;
    top: 55%;
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 25px;
    border: 1px solid #8bdcff;
    border-radius: 12px;
    background: #14516c;
    color: white;
    font-size: 16px;
    z-index: 15;
    touch-action: manipulation;
}

@media (pointer: coarse), (max-width: 700px) {
    #dropButton { display: block; }
    #help { display: none; }
    #title {
        padding-right: 48px;
        padding-left: 8px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="interface">
    <div id="title">❄ PIXEL CHRISTMAS TOWER ❄</div>
    <div id="score">Этажей: 0</div>
</div>

<div id="help">ПРОБЕЛ ИЛИ КЛИК — ОТПУСТИТЬ ЭТАЖ</div>

<button id="dropButton" type="button">⬇ ОТПУСТИТЬ ЭТАЖ</button>
<button id="fullscreen" type="button">⛶</button>

<div id="message">БАШНЯ РУХНУЛА!</div>
<button id="restart" type="button">Начать заново</button>

<script>
"use strict";

// =====================================
// ОСНОВНЫЕ ПЕРЕМЕННЫЕ
// =====================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const backgroundCanvas = document.createElement("canvas");
const bg = backgroundCanvas.getContext("2d");

let W = 0;
let H = 0;
let DPR = 1;

const FLOOR_H = 42;
const GRAVITY = 1250;

let blocks = [];
let active = null;
let score = 0;
let cameraY = 0;
let spawnTimer = 0;
let gameOver = false;
let collapsing = false;
let lastTime = 0;
let snow = [];

const mobile = () =>
    window.matchMedia("(max-width: 700px)").matches ||
    window.matchMedia("(pointer: coarse)").matches;

function random(min, max) {
    return min + Math.random() * (max - min);
}

// =====================================
// РАЗНЫЕ ФАСАДЫ ЭТАЖЕЙ
// =====================================

const styles = [
    {
        color: "#397c99",
        window: "#b5efff",
        trim: "#183e59",
        type: 0
    },
    {
        color: "#8b465b",
        window: "#ffe3a0",
        trim: "#522b45",
        type: 1
    },
    {
        color: "#526b85",
        window: "#a8e8ff",
        trim: "#263c58",
        type: 2
    },
    {
        color: "#6c7950",
        window: "#ffe5a0",
        trim: "#35472f",
        type: 3
    },
    {
        color: "#76558e",
        window: "#e7caff",
        trim: "#45305c",
        type: 4
    },
    {
        color: "#a06b42",
        window: "#fff0b8",
        trim: "#59402e",
        type: 5
    }
];

function makeBlock(x, y, w, color, specialStyle) {
    const styleIndex = specialStyle === undefined
        ? Math.floor(Math.random() * styles.length)
        : specialStyle;

    const style = styles[styleIndex];

    return {
        x: x,
        y: y,
        w: w,
        h: FLOOR_H,

        angle: 0,
        vx: 0,
        vy: 0,
        angular: 0,

        color: color || style.color,
        windowColor: style.window,
        trim: style.trim,
        style: style.type,

        moving: false,
        resting: false,
        landed: false,
        unstable: 0,

        direction: 1,
        speed: 190
    };
}

// =====================================
// ФОНОВЫЙ ГОРОД
// =====================================

let cityBuildings = [];

function createCity() {
    cityBuildings = [];

    let x = -10;
    let index = 0;

    while (x < W + 30) {
        const width = random(42, 100);
        const height = random(H * 0.16, H * 0.43);

        cityBuildings.push({
            x: x,
            width: width,
            height: height,
            roof: index % 5,
            color: [
                "#0a1729",
                "#101d31",
                "#10182b",
                "#132238",
                "#0c1b2d"
            ][index % 5],
            windowType: index % 4,
            seed: index * 17 + 5
        });

        x += width - random(2, 10);
        index++;
    }
}

function drawBackground() {
    if (!bg) return;

    bg.setTransform(DPR, 0, 0, DPR, 0, 0);

    // Небо
    const sky = bg.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#050817");
    sky.addColorStop(.48, "#10132d");
    sky.addColorStop(.78, "#17243d");
    sky.addColorStop(1, "#26384e");

    bg.fillStyle = sky;
    bg.fillRect(0, 0, W, H);

    // Свет над городом
    const glow = bg.createRadialGradient(
        W * .5, H * .65, 10,
        W * .5, H * .65, H * .65
    );

    glow.addColorStop(0, "rgba(44,104,145,.20)");
    glow.addColorStop(1, "rgba(5,8,23,0)");

    bg.fillStyle = glow;
    bg.fillRect(0, 0, W, H);

    // Звёзды
    for (let i = 0; i < 65; i++) {
        const x = (i * 137.5) % W;
        const y = (i * 73.7) % (H * .58);

        bg.fillStyle = i % 4 === 0
            ? "rgba(180,225,255,.85)"
            : "rgba(255,255,255,.55)";

        bg.beginPath();
        bg.arc(x, y, i % 5 === 0 ? 1.7 : 1, 0, Math.PI * 2);
        bg.fill();
    }

    // Луна
    const moonX = W * .82;
    const moonY = H * .19;

    const moonGlow = bg.createRadialGradient(
        moonX, moonY, 5,
        moonX, moonY, 100
    );

    moonGlow.addColorStop(0, "rgba(190,225,255,.25)");
    moonGlow.addColorStop(1, "rgba(190,225,255,0)");

    bg.fillStyle = moonGlow;
    bg.fillRect(moonX - 100, moonY - 100, 200, 200);

    bg.fillStyle = "#e8f4ff";
    bg.beginPath();
    bg.arc(moonX, moonY, 27, 0, Math.PI * 2);
    bg.fill();

    // Разные здания
    for (const b of cityBuildings) {
        const x = b.x;
        const y = H - b.height;
        const w = b.width;

        bg.fillStyle = b.color;
        bg.fillRect(x, y, w, b.height);

        // Крыши разных типов
        bg.fillStyle = "#18283d";

        if (b.roof === 0) {
            bg.fillRect(x - 4, y - 6, w + 8, 7);
        } else if (b.roof === 1) {
            bg.fillRect(x + w * .25, y - 17, w * .5, 17);
            bg.fillRect(x + w * .2, y - 5, w * .6, 5);
        } else if (b.roof === 2) {
            bg.beginPath();
            bg.moveTo(x, y);
            bg.lineTo(x + w / 2, y - 20);
            bg.lineTo(x + w, y);
            bg.fill();
        } else if (b.roof === 3) {
            bg.fillRect(x + w * .35, y - 27, w * .3, 27);
            bg.fillRect(x + w * .28, y - 4, w * .44, 4);
        } else {
            bg.fillRect(x - 3, y - 4, w + 6, 5);
            bg.fillRect(x + w * .12, y - 11, w * .76, 7);
        }

        // Окна
        const cols = Math.max(2, Math.floor(w / 18));
        const rows = Math.floor(b.height / 24);

        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                const seed = row * 13 + col * 7 + b.seed;

                if (seed % 5 === 0) continue;

                const wx = x + 7 + col * ((w - 14) / cols);
                const wy = y + 13 + row * 24;

                if (b.windowType === 0) {
                    bg.fillStyle = seed % 3 === 0
                        ? "rgba(255,190,91,.8)"
                        : "rgba(91,153,204,.6)";
                    bg.fillRect(wx, wy, 7, 11);
                } else if (b.windowType === 1) {
                    bg.fillStyle = "rgba(255,211,137,.75)";
                    bg.fillRect(wx, wy, 9, 8);
                } else if (b.windowType === 2) {
                    bg.fillStyle = "rgba(140,220,255,.65)";
                    bg.fillRect(wx, wy, 5, 15);
                } else {
                    bg.fillStyle = seed % 2
                        ? "rgba(255,207,130,.7)"
                        : "rgba(115,189,230,.6)";
                    bg.fillRect(wx, wy, 8, 8);
                }
            }
        }
    }

    // Ёлки
    for (let i = 0; i < 7; i++) {
        const x = i * (W / 6) + 10;
        const y = H - 8;
        const size = 32 + (i % 3) * 12;

        bg.fillStyle = "#061b1b";
        bg.beginPath();
        bg.moveTo(x, y - size * 2);
        bg.lineTo(x - size, y);
        bg.lineTo(x + size, y);
        bg.closePath();
        bg.fill();

        bg.strokeStyle = "rgba(190,226,241,.65)";
        bg.lineWidth = 2;
        bg.stroke();

        for (let j = 0; j < 3; j++) {
            const ly = y - size * 1.5 + j * size * .42;

            bg.fillStyle = j % 2
                ? "#7be9ed"
                : "#ffd36b";

            bg.beginPath();
            bg.arc(x + (j % 2 ? 8 : -8), ly, 2.5, 0, Math.PI * 2);
            bg.fill();
        }
    }

    // Снег на земле
    const ground = bg.createLinearGradient(0, H - 12, 0, H);
    ground.addColorStop(0, "#e9f8ff");
    ground.addColorStop(1, "#9dbdce");

    bg.fillStyle = ground;
    bg.fillRect(0, H - 8, W, 8);
}

// =====================================
// ИЗМЕНЕНИЕ РАЗМЕРА
// =====================================

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;

    DPR = Math.min(
        window.devicePixelRatio || 1,
        W < 700 ? 1.25 : 2
    );

    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    backgroundCanvas.width = Math.round(W * DPR);
    backgroundCanvas.height = Math.round(H * DPR);

    createCity();
    drawBackground();

    if (active) {
        const limit = Math.min(360, W * .36);
        active.x = Math.max(-limit, Math.min(limit, active.x));
    }

    snow = [];

    const snowCount = mobile() ? 45 : 100;

    for (let i = 0; i < snowCount; i++) {
        snow.push({
            x: random(0, W),
            y: random(0, H),
            r: random(1, 2.8),
            speed: random(25, 85)
        });
    }
}

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => {
    setTimeout(resize, 200);
});

// =====================================
// БАШНЯ
// =====================================

function towerTop() {
    let top = 0;

    for (const b of blocks) {
        if (b.resting) {
            top = Math.max(top, b.y + b.h / 2);
        }
    }

    return top;
}

function updateScore() {
    document.getElementById("score").textContent =
        "Этажей: " + score;
}

function spawnFloor() {
    if (gameOver || collapsing) return;

    const baseWidth = Math.min(300, W * .82);

    const width = Math.max(
        Math.min(105, W * .3),
        baseWidth - score * 1.6
    );

    active = makeBlock(
        -width / 2,
        towerTop() + 175,
        width
    );

    active.moving = true;
    active.speed = 190 + Math.min(score * 3, 130);
}

function releaseFloor() {
    if (!active || !active.moving || gameOver || collapsing) {
        return;
    }

    active.moving = false;
    active.vy = 0;
    active.resting = false;
    active.landed = false;

    blocks.push(active);
    active = null;
}

function startCollapse() {
    if (collapsing || gameOver) return;

    collapsing = true;
    spawnTimer = 0;
    active = null;

    for (const b of blocks) {
        b.resting = false;
        b.vy = random(-70, 100);
        b.vx += random(-100, 100);
        b.angular += random(-1.8, 1.8);
    }
}

function endGame() {
    if (gameOver) return;

    gameOver = true;

    document.getElementById("message").style.display = "block";
    document.getElementById("restart").style.display = "block";
}

// =====================================
// ФИЗИКА
// =====================================

function findSupport(block, oldBottom, newBottom) {
    let chosen = null;
    let chosenTop = -Infinity;

    for (const other of blocks) {
        if (other === block || !other.resting) continue;

        const top = other.y + other.h / 2;

        const overlap = Math.min(
            block.x + block.w / 2,
            other.x + other.w / 2
        ) - Math.max(
            block.x - block.w / 2,
            other.x - other.w / 2
        );

        if (overlap <= 0) continue;

        if (oldBottom >= top - 2 && newBottom <= top + 2 &&
            top > chosenTop) {
            chosen = other;
            chosenTop = top;
        }
    }

    return chosen;
}

function landBlock(block, support) {
    const overlap = Math.min(
        block.x + block.w / 2,
        support.x + support.w / 2
    ) - Math.max(
        block.x - block.w / 2,
        support.x - support.w / 2
    );

    const ratio = overlap / block.w;
    const offset = block.x - support.x;

    block.y = support.y + support.h / 2 + block.h / 2;
    block.vy = 0;
    block.vx = 0;

    if (Math.abs(offset) < support.w * .025) {
        block.angle = 0;
    } else {
        block.angle = Math.max(-.16, Math.min(.16,
            offset / support.w * .42
        ));
    }

    if (ratio < .42) {
        block.unstable = .45;
        block.angular = offset > 0 ? 1.5 : -1.5;
        block.resting = false;
    } else {
        block.resting = true;
        block.angular = 0;
        block.landed = true;

        score++;
        updateScore();

        spawnTimer = .65;
    }
}

function physics(dt) {
    if (collapsing) {
        for (const b of blocks) {
            b.vy -= GRAVITY * dt;
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            b.angle += b.angular * dt;
            b.angular *= .998;
        }

        if (blocks.every(b => b.y < -250)) {
            endGame();
        }

        return;
    }

    for (const b of blocks) {
        if (b.resting) continue;

        if (b.unstable > 0) {
            b.unstable -= dt;
            b.vy -= GRAVITY * dt;
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            b.angle += b.angular * dt;
            b.angular *= .998;

            if (b.unstable <= 0) {
                startCollapse();
            }

            continue;
        }

        const oldBottom = b.y - b.h / 2;

        b.vy -= GRAVITY * dt;
        b.y += b.vy * dt;

        const newBottom = b.y - b.h / 2;

        const support = findSupport(b, oldBottom, newBottom);

        if (support && b.vy < 0) {
            landBlock(b, support);
        }

        if (b.y < -300 || Math.abs(b.x) > 1200) {
            startCollapse();
            break;
        }
    }
}

// =====================================
// ОТРИСОВКА ЭТАЖЕЙ
// =====================================

function screenY(y) {
    return H - (y - cameraY);
}

function drawBlock(b) {
    const x = W / 2 + b.x;
    const y = screenY(b.y);

    ctx.save();

    ctx.translate(x, y);
    ctx.rotate(-b.angle);

    ctx.shadowColor = "rgba(91,226,255,.25)";
    ctx.shadowBlur = 7;

    ctx.fillStyle = b.color;
    ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);

    ctx.shadowBlur = 0;

    // Боковая тень
    ctx.fillStyle = "rgba(0,0,0,.22)";
    ctx.fillRect(-b.w / 2, -b.h / 2, 7, b.h);

    // Верхний и нижний карнизы
    ctx.fillStyle = b.trim;
    ctx.fillRect(-b.w / 2, -b.h / 2, b.w, 5);

    ctx.fillStyle = "rgba(210,245,255,.25)";
    ctx.fillRect(-b.w / 2, b.h / 2 - 3, b.w, 3);

    const count = Math.max(2, Math.floor(b.w / 48));
    const gap = b.w / count;

    for (let i = 0; i < count; i++) {
        const wx = -b.w / 2 + gap * i + gap / 2;

        if (b.style === 0) {
            // Обычные прямоугольные окна
            ctx.fillStyle = b.windowColor;
            ctx.fillRect(wx - 7, -8, 14, 19);

            ctx.strokeStyle = "#e1faff";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(wx - 7, -8, 14, 19);

            ctx.fillStyle = b.trim;
            ctx.fillRect(wx - 1, -8, 2, 19);
        }

        else if (b.style === 1) {
            // Арочные окна
            ctx.fillStyle = b.windowColor;
            ctx.fillRect(wx - 7, -4, 14, 15);

            ctx.beginPath();
            ctx.arc(wx, -4, 7, Math.PI, 0);
            ctx.fill();

            ctx.strokeStyle = "#ffe4b0";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(wx - 7, -4, 14, 15);
        }

        else if (b.style === 2) {
            // Панорамные окна
            ctx.fillStyle = b.windowColor;
            ctx.fillRect(wx - 9, -9, 18, 22);

            ctx.fillStyle = b.trim;
            ctx.fillRect(wx - 1, -9, 2, 22);
            ctx.fillRect(wx - 9, 1, 18, 2);
        }

        else if (b.style === 3) {
            // Узкие вертикальные окна
            ctx.fillStyle = b.windowColor;
            ctx.fillRect(wx - 5, -10, 10, 22);

            ctx.strokeStyle = "#e6f3d0";
            ctx.lineWidth = 1;
            ctx.strokeRect(wx - 5, -10, 10, 22);
        }

        else if (b.style === 4) {
            // Двойные окна
            ctx.fillStyle = b.windowColor;
            ctx.fillRect(wx - 8, -8, 6, 18);
            ctx.fillRect(wx + 2, -8, 6, 18);

            ctx.fillStyle = b.trim;
            ctx.fillRect(wx - 1, -8, 2, 18);
        }

        else {
            // Квадратные окна
            ctx.fillStyle = b.windowColor;
            ctx.fillRect(wx - 7, -7, 14, 14);

            ctx.strokeStyle = "#fff0c8";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(wx - 7, -7, 14, 14);
        }
    }

    // Гирлянда
    for (let i = 0; i < count * 2; i++) {
        const lx = -b.w / 2 + b.w / (count * 2) * i;

        ctx.fillStyle = i % 2 === 0
            ? "#ff646e"
            : "#ffe18a";

        ctx.beginPath();
        ctx.arc(lx, -b.h / 2 + 2, 2.5, 0, Math.PI * 2);
        ctx.fill();
    }

    // Декоративные полосы
    if (b.style === 1 || b.style === 4) {
        ctx.fillStyle = "rgba(255,255,255,.15)";
        ctx.fillRect(-b.w / 2, 12, b.w, 2);
    }

    ctx.restore();
}

// =====================================
// СНЕГ И ОТРИСОВКА
// =====================================

function updateSnow(dt) {
    for (const s of snow) {
        s.y += s.speed * dt;
        s.x += Math.sin(s.y * .015) * 12 * dt;

        if (s.y > H) {
            s.y = -5;
            s.x = random(0, W);
        }
    }
}

function draw() {
    // Готовый фон вместо повторной отрисовки города
    ctx.drawImage(
        backgroundCanvas,
        0, 0,
        backgroundCanvas.width,
        backgroundCanvas.height,
        0, 0, W, H
    );

    // Снег
    ctx.fillStyle = "rgba(255,255,255,.9)";

    for (const s of snow) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    }

    // Камера
    const target = Math.max(0, towerTop() - H * .63);
    cameraY += (target - cameraY) * .055;

    for (const b of blocks) {
        drawBlock(b);
    }

    if (active) {
        drawBlock(active);
    }
}

// =====================================
// ОБНОВЛЕНИЕ ИГРЫ
// =====================================

function update(dt) {
    updateSnow(dt);

    if (gameOver) return;

    if (active && active.moving) {
        const limit = Math.min(360, W * .36);

        active.x += active.direction * active.speed * dt;

        if (active.x > limit) {
            active.x = limit;
            active.direction = -1;
        }

        if (active.x < -limit) {
            active.x = -limit;
            active.direction = 1;
        }
    }

    physics(dt);

    if (!active && spawnTimer > 0 && !collapsing) {
        spawnTimer -= dt;

        if (spawnTimer <= 0) {
            spawnFloor();
        }
    }
}

// =====================================
// ПЕРЕЗАПУСК
// =====================================

function restartGame() {
    blocks = [];
    active = null;
    score = 0;
    cameraY = 0;
    spawnTimer = 0;
    gameOver = false;
    collapsing = false;

    document.getElementById("message").style.display = "none";
    document.getElementById("restart").style.display = "none";

    const baseWidth = Math.min(300, W * .82);

    const base = makeBlock(
        0,
        FLOOR_H / 2,
        baseWidth,
        "#315b72",
        2
    );

    base.resting = true;
    blocks.push(base);

    spawnFloor();
    updateScore();
}

// =====================================
// ИГРОВОЙ ЦИКЛ
// =====================================

function loop(time) {
    if (!lastTime) lastTime = time;

    const dt = Math.min((time - lastTime) / 1000, .025);
    lastTime = time;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

// =====================================
// УПРАВЛЕНИЕ
// =====================================

window.addEventListener("keydown", function(e) {
    if (e.code === "Space") {
        e.preventDefault();
        releaseFloor();
    }
});

canvas.addEventListener("pointerdown", function(e) {
    e.preventDefault();
    releaseFloor();
});

document.getElementById("dropButton").addEventListener(
    "pointerdown",
    function(e) {
        e.preventDefault();
        e.stopPropagation();
        releaseFloor();
    }
);

document.getElementById("restart").addEventListener(
    "click",
    restartGame
);

document.getElementById("fullscreen").addEventListener(
    "click",
    async function() {
        try {
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                }
            } else {
                await document.exitFullscreen();
            }
        } catch (error) {
            console.log("Полный экран недоступен:", error);
        }
    }
);

// =====================================
// ЗАПУСК
// =====================================

resize();
restartGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
